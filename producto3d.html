  <style>
    /* =========================================
       VARIABLES Y ESTILOS DEL MENÚ CARDNAV
       ========================================= */
    :root {
        --bg-principal: #f8fafc;
        --glass-bg: rgba(255, 255, 255, 0.45); 
        --glass-border: rgba(255, 255, 255, 0.7);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        
        --texto-principal: #0f172a;
        --texto-mutado: #64748b;
        --borde-claro: rgba(226, 232, 240, 0.6);

        /* Color de marca. Aquesta pàgina SEMPRE és verd maragda: el nivell de
           risc no ha de tenyir mai els botons ni els detalls. */
        --accent: #10b981;
        --accent-suau: rgba(16, 185, 129, 0.15);
        --accent-vora: rgba(16, 185, 129, 0.4);

        /* Color del risc en directe. L'escriu risc-live.js NOMÉS damunt de la
           píndola del menú, mai a l'arrel del document. */
        --riesgo-color-dinamico: #10b981;

        --transicion: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-principal);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Degradat verd de fons: viu al body i s'esvaeix suaument,
       així no queda tallat en sec en acabar la capçalera. */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 900px;
      background:
        radial-gradient(ellipse 120% 70% at 50% 0%, rgba(16, 185, 129, 0.16) 0%, rgba(16, 185, 129, 0.06) 40%, transparent 72%),
        linear-gradient(180deg, rgba(248, 250, 252, 0) 65%, var(--bg-principal) 100%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* ========= NUEVOS ESTILOS CARDNAV ========= */
    .card-nav-container {
        position: sticky;
        top: 1rem;
        margin: 0 auto;
        width: 90%;
        max-width: 1200px;
        z-index: 1000;
        box-sizing: border-box;
        margin-bottom: 2rem;
    }

    .card-nav {
        display: block;
        height: 60px;
        padding: 0;
        background-color: var(--glass-bg);
        backdrop-filter: blur(25px) saturate(120%);
        -webkit-backdrop-filter: blur(25px) saturate(120%);
        border: 1px solid var(--glass-border);
        border-radius: 0.75rem;
        box-shadow: var(--glass-shadow);
        position: relative;
        overflow: hidden;
        will-change: height;
    }

    .card-nav-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
        z-index: 2;
    }

    .hamburger-menu {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        gap: 6px;
        width: 40px;
    }

    .hamburger-menu:hover .hamburger-line { opacity: 0.75; }

    .hamburger-line {
        width: 24px;
        height: 2px;
        background-color: var(--texto-principal);
        transition: transform 0.25s ease, opacity 0.2s ease, margin 0.3s ease;
        transform-origin: 50% 50%;
    }

    .hamburger-menu.open .hamburger-line:first-child { transform: translateY(4px) rotate(45deg); }
    .hamburger-menu.open .hamburger-line:last-child { transform: translateY(-4px) rotate(-45deg); }

    .navbar-brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem;
        color: var(--texto-principal); text-decoration: none;
        transition: var(--transicion);
    }
    .navbar-brand img { height: 28px; }
    .nomes-lectors { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .card-nav-content {
        position: absolute;
        left: 0; right: 0; top: 60px; bottom: 0;
        padding: 0.5rem;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        visibility: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .card-nav.open .card-nav-content {
        visibility: visible;
        pointer-events: auto;
    }

    .nav-card {
        height: 100%;
        flex: 1 1 0;
        min-width: 0;
        border-radius: calc(0.75rem - 0.2rem);
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 16px 20px;
        gap: 8px;
        user-select: none;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-card-label { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; opacity: 0.9; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 5px; }
    .nav-card-links { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .nav-card-link {
        font-size: 0.95rem; font-weight: 500; color: inherit; cursor: pointer; text-decoration: none; transition: opacity 0.3s ease; display: inline-flex; align-items: center; gap: 10px;
    }
    .nav-card-link:hover { opacity: 0.6; }
    .nav-card-link svg { flex: none; opacity: 0.82; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16,1,0.3,1); }
    .nav-card-link:hover svg { opacity: 1; transform: translateX(2px); }

    /* Badge Risc dins del nav */
    .sticky-risk-badge {
        display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border); padding: 5px 12px; border-radius: 99px;
        font-weight: 700; font-size: 0.85rem; box-shadow: var(--glass-shadow);
        color: var(--texto-principal); text-decoration: none; white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(0.95);
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        pointer-events: none;
    }

    .sticky-risk-badge.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }
    a.sticky-risk-badge.visible:hover { background: rgba(255, 255, 255, 0.85); }
    .sticky-risk-badge.is-carregant { opacity: 0.55; }
    @media (prefers-reduced-motion: reduce) { .sticky-risk-dot { animation: none; } }

    .sticky-risk-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--riesgo-color-dinamico); box-shadow: 0 0 8px var(--riesgo-color-dinamico); animation: pulseLive 1.5s infinite; }

    @keyframes pulseLive { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

    @media (max-width: 768px) {
        .card-nav-container { width: 95%; top: 0.5rem; }
        .card-nav-top { justify-content: space-between; gap: 8px; }
        .hamburger-menu { order: 3; }
        .logo-container { order: 1; }
        .right-controls-nav { order: 2; display: flex !important; } 
        .sticky-risk-badge { padding: 4px 8px; font-size: 0.78rem; }
        
        .card-nav-content {
            flex-direction: column; 
            align-items: stretch; 
            gap: 8px; 
            padding: 0.5rem; 
            top: 60px; 
            bottom: auto; 
            justify-content: flex-start;
            overflow-y: auto; 
            max-height: calc(100vh - 80px); 
        }
        .nav-card { height: auto; min-height: auto; flex: none; padding: 16px; }
        .nav-card-label { font-size: 1.1rem; }
        .nav-card-links { gap: 12px; margin-top: 10px; }
    }

    /* =========================================
       CSS: ROTATING TEXT & OTROS COMPONENTES
       ========================================= */
    .text-rotate {
      display: flex;
      flex-wrap: wrap;
      white-space: pre-wrap;
      position: relative;
    }
    .text-rotate-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .text-rotate-word { display: inline-flex; }
    .text-rotate-lines { display: flex; flex-direction: column; width: 100%; }
    .text-rotate-element { display: inline-block; }
    .text-rotate-space { white-space: pre; }

    .parallax { position: relative; overflow: hidden; }
    .scroller {
      display: flex; white-space: nowrap; text-align: center; font-family: sans-serif;
      font-size: 2.25rem; font-weight: bold; letter-spacing: -0.02em;
    }
    .scroller span { flex-shrink: 0; }
    @media (min-width: 768px) { .scroller { font-size: 4rem; line-height: 4rem; } }
    .custom-scroll-text { color: #059669; text-transform: uppercase; padding-right: 2rem; }

    .accordion-gallery {
      --ag-accent: #059669; --ag-overlay: #f8fafc; --ag-text: #0f172a; --ag-gap: 12px; --ag-radius: 20px; --ag-media-size: 320px;
      display: flex; flex-direction: row; gap: var(--ag-gap); width: 100%; max-width: 100%;
      perspective: 1400px; perspective-origin: 50% 50%;
    }
    .accordion-gallery--vertical { flex-direction: column; }
    .ag-panel {
      position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; border-radius: var(--ag-radius);
      cursor: pointer; display: block; text-decoration: none; outline: none; transform-style: preserve-3d;
      transform-origin: center center; background: #e2e8f0; box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.2);
      will-change: flex-grow, transform; -webkit-tap-highlight-color: transparent;
      padding: 0; border: 0; font: inherit; color: inherit; appearance: none;
    }
    .ag-panel:focus-visible { box-shadow: 0 0 0 2px var(--ag-accent), 0 10px 30px -18px rgba(0, 0, 0, 0.3); }
    .ag-panel__frame { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
    .ag-panel__media {
      --ag-gray: 1; --ag-dim: 0.15; position: absolute; top: 50%; left: 50%; width: var(--ag-media-size);
      height: 100%; filter: grayscale(var(--ag-gray)); will-change: transform, filter;
    }
    .accordion-gallery--vertical .ag-panel__media { width: 100%; height: var(--ag-media-size); }
    .ag-panel__media img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
    .ag-panel__overlay {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 35%, color-mix(in srgb, var(--ag-overlay) 90%, transparent) 100%),
                  color-mix(in srgb, var(--ag-overlay) calc(var(--ag-dim, 0.15) * 100%), transparent);
    }
    .ag-panel__label { position: absolute; left: 20px; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 12px; pointer-events: none; z-index: 2; }
    .ag-panel__bar { flex: 0 0 auto; width: 4px; height: 26px; border-radius: 4px; background: var(--ag-accent); opacity: 0; }
    .ag-panel__text {
      color: var(--ag-text); font-family: inherit; font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.4rem);
      letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0;
    }
    /* Al mòbil l'acordió no es desactiva: només canvia d'orientació.
       El JS afegeix .accordion-gallery--vertical i el gir passa a l'eix X. */
    @media (max-width: 680px) {
      .accordion-gallery { --ag-radius: 16px; --ag-gap: 10px; perspective: 900px; }
      .ag-panel__label { left: 14px; right: 14px; bottom: 14px; }
      .ag-panel__text { font-size: 0.92rem; white-space: normal; line-height: 1.3; }
    }
    @media (prefers-reduced-motion: reduce) { .ag-panel, .ag-panel__media { will-change: auto; } }

    /* Descripció del panell seleccionat de la galeria */
    .ag-detail {
      margin-top: 22px; padding: 22px 24px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.6); border: 1px solid var(--borde-claro);
      animation: agDetailIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .ag-detail-index {
      display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em;
      color: var(--accent); margin-bottom: 8px; font-variant-numeric: tabular-nums;
    }
    .ag-detail strong { display: block; font-size: 1.05rem; font-weight: 800; color: var(--texto-principal); line-height: 1.35; }
    .ag-detail p { margin: 8px 0 0; font-size: 0.92rem; color: var(--texto-mutado); line-height: 1.7; max-width: 78ch; }
    @keyframes agDetailIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ag-detail { animation: none; } }
    @media (max-width: 680px) { .ag-detail { padding: 18px; margin-top: 16px; } }

    .model-container {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 1) 70%);
    }

    /* =========================================
       ESTILS NOUS: PÀGINA CENTRADA EN EL DISPOSITIU
       ========================================= */
    .hero-eyebrow-chip {
      display: inline-flex; align-items: center; gap: 8px; background: var(--accent-suau);
      color: var(--accent); padding: 6px 16px; border-radius: 99px; font-weight: 800;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--accent-vora);
      margin-bottom: 22px;
    }
    .quick-specs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .quick-spec-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px 10px; text-align: center;
      box-shadow: var(--glass-shadow); transition: var(--transicion);
    }
    .quick-spec-card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.7); }
    .quick-spec-icon {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(5,150,105,0.10); border: 1px solid rgba(5,150,105,0.18); color: var(--accent);
    }
    .quick-spec-label { font-weight: 700; font-size: 0.78rem; color: var(--texto-principal); line-height: 1.3; }

    /* Icones SVG: mida uniforme a tota la pàgina */
    .ico { display: inline-block; flex: none; vertical-align: middle; }

    .header-sadrif-seccion { max-width: 1000px; margin: 0 auto 32px; text-align: center; }
    .header-sadrif-seccion h3 { margin: 0 0 10px; }
    .header-sadrif-seccion p { margin: 0; }

    /* Visor 3D a tota amplada */
    .viewer-shell {
      max-width: 1150px; margin: 0 auto; position: relative;
      background: var(--glass-bg); backdrop-filter: blur(24px) saturate(120%); -webkit-backdrop-filter: blur(24px) saturate(120%);
      border: 1px solid var(--glass-border); border-radius: 28px; box-shadow: var(--glass-shadow);
      padding: 14px; overflow: hidden;
    }
    .viewer-shell::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(16,185,129,0.10), transparent 70%);
    }
    .viewer-stage { position: relative; height: 62vh; min-height: 380px; max-height: 660px; border-radius: 18px; overflow: hidden; }
    .viewer-hint {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
      display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 99px;
      padding: 6px 14px; font-size: 0.75rem; font-weight: 600; color: var(--texto-mutado);
      pointer-events: none; white-space: nowrap;
      animation: viewerHintOut 0.6s ease 7s forwards;
    }
    @keyframes viewerHintOut { to { opacity: 0; transform: translate(-50%, 8px); } }
    @media (max-width: 640px) { .viewer-stage { height: 52vh; min-height: 320px; } .viewer-shell { padding: 10px; border-radius: 22px; } }
    @media (max-width: 400px) { .viewer-hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { .viewer-hint { animation: none; } }

    .model-toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    .toolbar-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .toolbar-btn {
      display: inline-flex; align-items: center; gap: 7px; background: var(--glass-bg); backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border); padding: 9px 16px; border-radius: 99px; font-weight: 700; font-size: 0.82rem;
      color: var(--texto-principal); cursor: pointer; transition: var(--transicion); box-shadow: var(--glass-shadow);
    }
    .toolbar-btn:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
    .toolbar-btn.actiu { background: var(--accent); color: #fff; border-color: transparent; }
    .toolbar-btn.ar-btn { background: rgba(15,23,42,0.92); color: #fff; border-color: transparent; }
    .toolbar-btn.ar-btn:hover { background: var(--accent); }
    .toolbar-divider { width: 1px; align-self: stretch; background: var(--borde-claro); margin: 0 2px; }
    @media (max-width: 640px) { .toolbar-divider { display: none; } }

    .spec-sheet-card {
      max-width: 900px; margin: 0 auto; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%); border: 1px solid var(--glass-border); border-radius: 22px;
      box-shadow: var(--glass-shadow); padding: 30px 32px; transition: var(--transicion);
    }
    .spec-sheet-toggle-btn {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(15,23,42,0.92); color: #fff;
      padding: 11px 22px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none;
      transition: var(--transicion);
    }
    .spec-sheet-toggle-btn:hover { background: var(--accent); }
    .spec-sheet-toggle-btn svg { transition: transform 0.3s ease; }
    .spec-sheet-toggle-btn.obert svg { transform: rotate(180deg); }
    .spec-sheet-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, margin-top 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

    .spec-groups { display: grid; gap: 24px; }

    .spec-item-head {

    .spec-item-ico {
      flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: rgba(5, 150, 105, 0.10); border: 1px solid rgba(5, 150, 105, 0.18); color: var(--accent);

    .spec-meta span {

    }
    @media (max-width: 520px) { .spec-item-detail { padding-left: 18px; } .spec-sheet-card { padding: 24px 18px; } }

    /* ===== SECCIÓ DE VÍDEO ===== */
    .video-section { position: relative; overflow: hidden; background: #0b1220; }
    .video-section::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(16, 185, 129, 0.18), transparent 65%);

    .video-wrap { position: relative; max-width: 1150px; margin: 0 auto; }
    .video-head { text-align: center; max-width: 760px; margin: 0 auto 34px; }
    .video-head h3 { color: #fff; margin: 0 0 12px; }
    .video-head p { color: #94a3b8; margin: 0; font-size: 1.05rem; line-height: 1.6; }
    .yt-facade {
      position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 26px; overflow: hidden;
      background: #000; border: 1px solid rgba(255, 255, 255, 0.10); cursor: pointer; display: block; padding: 0;
      box-shadow: 0 45px 90px -35px rgba(0, 0, 0, 0.9); -webkit-tap-highlight-color: transparent;
    }
    .yt-facade img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease; }
    .yt-facade:hover img { transform: scale(1.045); filter: brightness(0.75); }
    .yt-facade iframe { width: 100%; height: 100%; border: 0; display: block; }
    .yt-veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 40%, rgba(0,0,0,0.55) 100%); }
    .yt-play {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
      width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; color: #fff;
      background: rgba(5, 150, 105, 0.92); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
      animation: ytPulse 2.6s ease-out infinite;

    .yt-facade:hover .yt-play { transform: translate(-50%, -50%) scale(1.1); background: #059669; }
    @keyframes ytPulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 70% { box-shadow: 0 0 0 26px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
    .yt-caption {
      position: absolute; left: 24px; bottom: 22px; right: 24px; pointer-events: none; color: #fff;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .yt-caption strong { font-size: 1.05rem; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .yt-badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(10px); border-radius: 99px;
      padding: 4px 12px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    }
    @media (max-width: 640px) { .yt-play { width: 64px; height: 64px; } .yt-facade { border-radius: 18px; } .yt-caption { left: 16px; right: 16px; bottom: 14px; } .yt-caption strong { font-size: 0.9rem; } }
    @media (prefers-reduced-motion: reduce) { .yt-play { animation: none; } }

    /* ===== COM FUNCIONA (flux en 4 passos) ===== */
    .flow-grid { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .flow-step {
      position: relative; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%); border: 1px solid var(--glass-border);
      border-radius: 20px; box-shadow: var(--glass-shadow); padding: 26px 22px; transition: var(--transicion);
    }
    .flow-step:hover { transform: translateY(-6px); box-shadow: 0 22px 45px -20px rgba(15,23,42,0.28); }
    .flow-step-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .flow-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(5,150,105,0.10); border: 1px solid rgba(5,150,105,0.18); color: var(--accent); }
    .flow-n { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; color: var(--texto-mutado); }
    .flow-step h4 { margin: 0 0 8px; font-size: 1.05rem; font-weight: 800; color: var(--texto-principal); }
    .flow-step p { margin: 0; font-size: 0.87rem; color: var(--texto-mutado); line-height: 1.6; }
    .flow-step:not(:last-child)::after {
      content: ''; position: absolute; top: 46px; right: -13px; width: 8px; height: 8px; z-index: 2;
      border-top: 2px solid var(--accent); border-right: 2px solid var(--accent);
      transform: rotate(45deg); opacity: 0.5;
    }
    @media (max-width: 980px) { .flow-grid { grid-template-columns: repeat(2, 1fr); } .flow-step:not(:last-child)::after { display: none; } }
    @media (max-width: 560px) { .flow-grid { grid-template-columns: 1fr; } }

    /* ===== CADENA D'ALIMENTACIÓ ===== */
    /* Vora elèctrica, inspirada en el component d'Electric Border de React Bits
       (https://reactbits.dev/animations/electric-border). L'original dibuixa la
       vora en un <canvas> amb soroll de Perlin: per a aquesta caixa serien unes
       1.400 mostres i ~6,8 milions de Math.sin per segon, en bucle infinit i
       sense parar. Al mòbil això es nota. Aquí el mateix efecte es fa amb un
       degradat cònic que gira: ho porta el compositor de la GPU, no la CPU, i
       el cost és pràcticament zero. */
    @property --eb-gir {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes ebGir { to { --eb-gir: 360deg; } }

    .power-card {
      position: relative; isolation: isolate;
      max-width: 1150px; margin: 28px auto 0; background: linear-gradient(135deg, rgba(15,23,42,0.96) 0%, rgba(30,41,59,0.96) 100%);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px 28px; color: #fff;
    }
    /* Els dos arcs de llum que recorren la vora. Només aquesta capa s'anima. */
    .power-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px;
      background: conic-gradient(from var(--eb-gir),
        transparent 0deg 34deg, rgba(52,211,153,0.55) 48deg, #6ee7b7 62deg, #d1fae5 70deg, #6ee7b7 78deg, rgba(52,211,153,0.55) 92deg, transparent 106deg 214deg,
        rgba(16,185,129,0.45) 228deg, #34d399 242deg, #a7f3d0 250deg, #34d399 258deg, rgba(16,185,129,0.45) 272deg, transparent 286deg 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: ebGir 6s linear infinite;
      pointer-events: none; z-index: 0;
    }
    /* Halo difús. NO s'anima: un desenfocat que es repintés cada fotograma
       seria justament la part cara per a la bateria. Es rasteritza un cop. */
    .power-card::after {
      content: ''; position: absolute; inset: -3px; border-radius: inherit; padding: 3px;
      background: conic-gradient(from 0deg,
        rgba(16,185,129,0.10) 0deg, rgba(52,211,153,0.34) 90deg, rgba(16,185,129,0.10) 180deg,
        rgba(52,211,153,0.30) 270deg, rgba(16,185,129,0.10) 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      filter: blur(7px);
      pointer-events: none; z-index: 0;
    }
    .power-card > * { position: relative; z-index: 1; }

    /* Un pols de llum que baixa per la cadena, com l'energia que hi circula. */
    @keyframes ebPols {
      0%, 62%, 100% { color: #6ee7b7; text-shadow: none; }
      12%           { color: #ecfdf5; text-shadow: 0 0 12px rgba(110,231,183,0.9); }
    }
    .power-node .power-ico { animation: ebPols 4.2s ease-in-out infinite; animation-delay: calc(var(--n, 0) * 0.42s); }
    .power-link { animation: ebPols 4.2s ease-in-out infinite; animation-delay: calc((var(--n, 0) + 0.5) * 0.42s); }

    /* Si el sistema demana reduir el moviment, es queda tot quiet però amb la
       vora pintada: no es perd el disseny, només el moviment. */
    @media (prefers-reduced-motion: reduce) {
      .power-card::before { animation: none; }
      .power-node .power-ico, .power-link { animation: none; }
    }
    .power-card h4 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 800; }
    .power-card > p { margin: 0 0 24px; color: #94a3b8; font-size: 0.92rem; line-height: 1.6; max-width: 70ch; }
    .power-chain { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
    .power-node {
      flex: 1 1 140px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    }
    .power-node .power-ico { color: #6ee7b7; }
    .power-node strong { font-size: 0.86rem; font-weight: 700; line-height: 1.3; }
    .power-node span { font-size: 0.75rem; color: #94a3b8; line-height: 1.45; }
    .power-link { display: grid; place-items: center; color: #475569; flex: none; }
    @media (max-width: 760px) {
      .power-link { width: 100%; transform: rotate(90deg); padding: 4px 0; }
      .power-node { flex: 1 1 100%; }
    }

    /* ===== XIFRES ===== */
    .stats-band { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat-card {
      background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--glass-shadow);
      padding: 26px 20px; text-align: center; transition: var(--transicion);

    .stat-card:hover { transform: translateY(-5px); }
    .stat-num { font-size: clamp(2rem, 4vw, 2.6rem); font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat-num small { font-size: 0.45em; font-weight: 700; margin-left: 2px; }
    .stat-label { margin-top: 10px; font-size: 0.8rem; font-weight: 700; color: var(--texto-principal); }
    .stat-sub { margin-top: 4px; font-size: 0.74rem; color: var(--texto-mutado); }
    @media (max-width: 860px) { .stats-band { grid-template-columns: repeat(2, 1fr); } }

    /* ===== PREGUNTES FREQÜENTS ===== */
    .faq-list { max-width: 860px; margin: 0 auto; }

    .faq-item.obert .faq-a { grid-template-rows: 1fr; }

    .gallery-wrap-card {

      -webkit-backdrop-filter: blur(20px) saturate(120%); border: 1px solid var(--glass-border); border-radius: 26px;
      box-shadow: var(--glass-shadow); padding: 26px;

    .explore-cta-card {

      color: #fff; border-radius: 20px; padding: 28px; text-decoration: none; transition: var(--transicion);
      border: 1px solid rgba(255,255,255,0.08);

    @media (max-width: 560px) { .explore-cta-grid { grid-template-columns: 1fr; } }

    /* ========= FOOTER COMPARTIT (igual a totes les pàgines) ========= */
    .site-footer {
      position: relative; background: #0b1220; color: #cbd5e1; padding: 64px 20px 26px;
      font-size: 0.9rem; overflow: hidden;
    }
    .site-footer::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;

    .footer-brand-logo img { height: 30px; filter: brightness(0) invert(1); }

    .footer-social { display: flex; gap: 10px; }
    .footer-social a {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: #cbd5e1;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease, border-color 0.25s ease;

    .footer-col h5 {
      margin: 0 0 16px; font-size: 0.71rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: #64748b;
    }
    .footer-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
    .footer-col a { color: #cbd5e1; text-decoration: none; font-size: 0.87rem; transition: color 0.22s ease; display: inline-flex; align-items: center; gap: 7px; }
    .footer-col a:hover { color: #6ee7b7; }

      display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px;

    @media (max-width: 900px) { .footer-inner { grid-template-columns: 1fr 1fr; gap: 36px 24px; } }
    @media (max-width: 560px) {

    }
  </style>

  <!-- Encapçalament principal de la pàgina. Va a l'HTML i no dins de React
       perquè els cercadors el trobin sense haver d'executar JavaScript.
       Només per a lectors de pantalla: el disseny visual no canvia. -->
  <h1 class="nomes-lectors">El dispositiu SADRIF en 3D · estació autònoma de detecció de risc d'incendis forestals</h1>

  <div id="root"></div>

  <!-- Lógica React -->
  <script src="js/producto3d.js"></script>

  <!-- SCRIPT DEL MENÚ CARDNAV (GSAP) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const navEl = document.getElementById('card-nav');
        const hamburger = document.getElementById('card-nav-hamburger');
        const contentEl = document.getElementById('card-nav-content');
        const cards = document.querySelectorAll('.nav-card');
        let isExpanded = false;
        let navTimeline;

        gsap.set(navEl, { height: 60, overflow: 'hidden' });
        gsap.set(cards, { y: 50, opacity: 0 });
        navTimeline = gsap.timeline({ paused: true });

        function calculateHeight() {
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (isMobile) {
                const wasVisibility = contentEl.style.visibility;
                const wasPosition = contentEl.style.position;
                contentEl.style.visibility = 'hidden';
                contentEl.style.position = 'absolute';
                contentEl.style.display = 'flex';
                const contentHeight = contentEl.scrollHeight;
                contentEl.style.visibility = wasVisibility;
                contentEl.style.position = wasPosition;
                contentEl.style.display = '';

                const topBar = 60;
                const padding = 16;
                return topBar + contentHeight + padding;
            }
            return 260; 
        }

        function createTimeline() {
            navTimeline.clear();
            navTimeline.to(navEl, { height: calculateHeight, duration: 0.5, ease: 'power2.inOut' });
            navTimeline.to(cards, { y: 0, opacity: 1, duration: 0.42, ease: 'power2.out', stagger: 0.07 }, '-=0.28');
        }

        createTimeline();

        hamburger.addEventListener('click', () => {
            isExpanded = !isExpanded;
            hamburger.classList.toggle('open', isExpanded);
            navEl.classList.toggle('open', isExpanded);
            contentEl.setAttribute('aria-hidden', !isExpanded);

            if (isExpanded) {
                navTimeline.timeScale(1).play(0);
            } else {
                navTimeline.timeScale(1.15).reverse();
            }
        });

        window.addEventListener('resize', () => {
            if (isExpanded) {
                gsap.set(navEl, { height: calculateHeight() });
                createTimeline();
                navTimeline.progress(1);
            } else {
                createTimeline();
            }
        });
        
        document.querySelectorAll('.nav-card-link').forEach(link => {
            link.addEventListener('click', () => {
                if (isExpanded) {
                    hamburger.click();
                }
            });
        });

        // Tancar el menú amb Escape i obrir-lo amb Enter o Espai.
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && isExpanded) hamburger.click(); });
        hamburger.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hamburger.click(); }
        });

        // Píndola del risc en directe: sempre visible en aquesta pàgina.
        if (window.SadrifRisc) window.SadrifRisc.initPindola();
    });
  </script>
