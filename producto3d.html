<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo 3D SADRIF - Proyecto TDR</title>
  
  <!-- 1. Cargar la librería oficial de Google para 3D en la web -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      max-width: 700px;
      margin-bottom: 1.5rem;
    }

    /* Enlace para volver a la web principal */
    .back-btn {
      display: inline-block;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid #0284c7;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    .container-3d {
      width: 100%;
      max-width: 950px;
      height: 580px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Elemento del modelo 3D */
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Estilo de los puntos interactivos (Hotspots) */
    .Hotspot {
      background: #38bdf8;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      cursor: pointer;
      height: 22px;
      width: 22px;
      padding: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .Hotspot:hover {
      transform: scale(1.3);
      background: #0284c7;
    }

    /* Ventana emergente al pasar el cursor sobre el punto */
    .HotspotAnnotation {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      color: #f8fafc;
      display: block;
      font-size: 13px;
      font-weight: 600;
      left: calc(100% + 12px);
      padding: 8px 12px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .Hotspot:hover .HotspotAnnotation,
    .Hotspot:focus .HotspotAnnotation {
      opacity: 1;
    }

    /* Indicador visual en la parte inferior */
    .controls-hint {
      margin-top: 1.5rem;
      background-color: #1e293b;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    /* Ajustes para pantallas pequeñas/móviles */
    @media (max-width: 640px) {
      .container-3d {
        height: 420px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <!-- Enlace para retornar a la página principal -->
    <a href="web tdr Pruebas.html" class="back-btn">← Volver al Inicio</a>
    
    <h1>Dispositivo SADRIF</h1>
    <p class="subtitle">Arrastra para girar | Rueda del ratón para Zoom | Pasa el cursor por los puntos de información</p>
  </header>

  <div class="container-3d">
    <!-- Carga tu archivo mi_dispositivo.glb -->
    <model-viewer 
      src="mi_dispositivo.glb" 
      alt="Modelo 3D del dispositivo SADRIF" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1.5"
      shadow-softness="1"
      exposure="1"
      ar>

      <!-- Punto interactivo 1 -->
      <button class="Hotspot" slot="hotspot-1" data-position="0m 0.1m 0m" data-normal="0m 1m 0m">
        <div class="HotspotAnnotation">Anemómetro / Sensores Superiores</div>
      </button>

      <!-- Punto interactivo 2 -->
      <button class="Hotspot" slot="hotspot-2" data-position="0.1m 0m 0m" data-normal="1m 0m 0m">
        <div class="HotspotAnnotation">Panel Frontal SADRIF</div>
      </button>

    </model-viewer>
  </div>

  <div class="controls-hint">
    💡 <strong>Tip:</strong> Si abres esta página desde un smartphone, puedes pulsar el icono de Realidad Aumentada para situar el SADRIF en tu mesa.
  </div>

</body>
</html>
