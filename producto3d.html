  <style>
    /* =========================================
       VARIABLES Y ESTILOS DEL MENÚ CARDNAV
       ========================================= */
    :root {
        --bg-principal: #f8fafc;
        --glass-bg: rgba(255, 255, 255, 0.45); 
        --glass-border: rgba(255, 255, 255, 0.7);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        
        --texto-principal: #0f172a;
        --texto-mutado: #64748b;
        --borde-claro: rgba(226, 232, 240, 0.6);

        /* Variables Dinámicas */
        --riesgo-color-dinamico: #10b981; 
        --riesgo-bg-suave: rgba(16, 185, 129, 0.15);
        --riesgo-borde: rgba(16, 185, 129, 0.4);

        --transicion: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-principal);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Degradat verd de fons: viu al body i s'esvaeix suaument,
       així no queda tallat en sec en acabar la capçalera. */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 900px;
      background:
        radial-gradient(ellipse 120% 70% at 50% 0%, rgba(16, 185, 129, 0.16) 0%, rgba(16, 185, 129, 0.06) 40%, transparent 72%),
        linear-gradient(180deg, rgba(248, 250, 252, 0) 65%, var(--bg-principal) 100%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* ========= NUEVOS ESTILOS CARDNAV ========= */
    .card-nav-container {
        position: sticky;
        top: 1rem;
        margin: 0 auto;
        width: 90%;
        max-width: 1200px;
        z-index: 1000;
        box-sizing: border-box;
        margin-bottom: 2rem;
    }

    .card-nav {
        display: block;
        height: 60px;
        padding: 0;
        background-color: var(--glass-bg);
        backdrop-filter: blur(25px) saturate(120%);
        -webkit-backdrop-filter: blur(25px) saturate(120%);
        border: 1px solid var(--glass-border);
        border-radius: 0.75rem;
        box-shadow: var(--glass-shadow);
        position: relative;
        overflow: hidden;
        will-change: height;
    }

    .card-nav-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
        z-index: 2;
    }

    .hamburger-menu {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        gap: 6px;
        width: 40px;
    }

    .hamburger-menu:hover .hamburger-line { opacity: 0.75; }

    .hamburger-line {
        width: 24px;
        height: 2px;
        background-color: var(--texto-principal);
        transition: transform 0.25s ease, opacity 0.2s ease, margin 0.3s ease;
        transform-origin: 50% 50%;
    }

    .hamburger-menu.open .hamburger-line:first-child { transform: translateY(4px) rotate(45deg); }
    .hamburger-menu.open .hamburger-line:last-child { transform: translateY(-4px) rotate(-45deg); }

    .navbar-brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem;
        color: var(--texto-principal); text-decoration: none;
        transition: var(--transicion);
    }
    .navbar-brand img { height: 28px; }

    .card-nav-content {
        position: absolute;
        left: 0; right: 0; top: 60px; bottom: 0;
        padding: 0.5rem;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        visibility: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .card-nav.open .card-nav-content {
        visibility: visible;
        pointer-events: auto;
    }

    .nav-card {
        height: 100%;
        flex: 1 1 0;
        min-width: 0;
        border-radius: calc(0.75rem - 0.2rem);
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 16px 20px;
        gap: 8px;
        user-select: none;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-card-label { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; opacity: 0.9; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 5px; }
    .nav-card-links { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .nav-card-link {
        font-size: 0.95rem; font-weight: 500; color: inherit; cursor: pointer; text-decoration: none; transition: opacity 0.3s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-card-link:hover { opacity: 0.6; }

    /* Badge Risc dins del nav */
    .sticky-risk-badge {
        display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border); padding: 5px 12px; border-radius: 99px;
        font-weight: 700; font-size: 0.85rem; box-shadow: var(--glass-shadow);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(0.95);
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        pointer-events: none;
    }

    .sticky-risk-badge.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .sticky-risk-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--riesgo-color-dinamico); box-shadow: 0 0 8px var(--riesgo-color-dinamico); animation: pulseLive 1.5s infinite; }

    @keyframes pulseLive { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

    @media (max-width: 768px) {
        .card-nav-container { width: 95%; top: 0.5rem; }
        .card-nav-top { justify-content: space-between; gap: 8px; }
        .hamburger-menu { order: 3; }
        .logo-container { order: 1; }
        .right-controls-nav { order: 2; display: flex !important; } 
        .sticky-risk-badge { padding: 4px 8px; font-size: 0.78rem; }
        
        .card-nav-content {
            flex-direction: column; 
            align-items: stretch; 
            gap: 8px; 
            padding: 0.5rem; 
            top: 60px; 
            bottom: auto; 
            justify-content: flex-start;
            overflow-y: auto; 
            max-height: calc(100vh - 80px); 
        }
        .nav-card { height: auto; min-height: auto; flex: none; padding: 16px; }
        .nav-card-label { font-size: 1.1rem; }
        .nav-card-links { gap: 12px; margin-top: 10px; }
    }

    /* =========================================
       CSS: ROTATING TEXT & OTROS COMPONENTES
       ========================================= */
    .text-rotate {
      display: flex;
      flex-wrap: wrap;
      white-space: pre-wrap;
      position: relative;
    }
    .text-rotate-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .text-rotate-word { display: inline-flex; }
    .text-rotate-lines { display: flex; flex-direction: column; width: 100%; }
    .text-rotate-element { display: inline-block; }
    .text-rotate-space { white-space: pre; }

    .parallax { position: relative; overflow: hidden; }
    .scroller {
      display: flex; white-space: nowrap; text-align: center; font-family: sans-serif;
      font-size: 2.25rem; font-weight: bold; letter-spacing: -0.02em;
    }
    .scroller span { flex-shrink: 0; }
    @media (min-width: 768px) { .scroller { font-size: 4rem; line-height: 4rem; } }
    .custom-scroll-text { color: #059669; text-transform: uppercase; padding-right: 2rem; }

    .accordion-gallery {
      --ag-accent: #059669; --ag-overlay: #f8fafc; --ag-text: #0f172a; --ag-gap: 12px; --ag-radius: 20px; --ag-media-size: 320px;
      display: flex; flex-direction: row; gap: var(--ag-gap); width: 100%; max-width: 100%;
      perspective: 1400px; perspective-origin: 50% 50%;
    }
    .accordion-gallery--vertical { flex-direction: column; }
    .ag-panel {
      position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; border-radius: var(--ag-radius);
      cursor: pointer; display: block; text-decoration: none; outline: none; transform-style: preserve-3d;
      transform-origin: center center; background: #e2e8f0; box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.2);
      will-change: flex-grow, transform; -webkit-tap-highlight-color: transparent;
      padding: 0; border: 0; font: inherit; color: inherit; appearance: none;
    }
    .ag-panel:focus-visible { box-shadow: 0 0 0 2px var(--ag-accent), 0 10px 30px -18px rgba(0, 0, 0, 0.3); }
    .ag-panel__frame { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
    .ag-panel__media {
      --ag-gray: 1; --ag-dim: 0.15; position: absolute; top: 50%; left: 50%; width: var(--ag-media-size);
      height: 100%; filter: grayscale(var(--ag-gray)); will-change: transform, filter;
    }
    .accordion-gallery--vertical .ag-panel__media { width: 100%; height: var(--ag-media-size); }
    .ag-panel__media img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
    .ag-panel__overlay {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 35%, color-mix(in srgb, var(--ag-overlay) 90%, transparent) 100%),
                  color-mix(in srgb, var(--ag-overlay) calc(var(--ag-dim, 0.15) * 100%), transparent);
    }
    .ag-panel__label { position: absolute; left: 20px; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 12px; pointer-events: none; z-index: 2; }
    .ag-panel__bar { flex: 0 0 auto; width: 4px; height: 26px; border-radius: 4px; background: var(--ag-accent); opacity: 0; }
    .ag-panel__text {
      color: var(--ag-text); font-family: inherit; font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.4rem);
      letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0;
    }
    /* Al mòbil l'acordió no es desactiva: només canvia d'orientació.
       El JS afegeix .accordion-gallery--vertical i el gir passa a l'eix X. */
    @media (max-width: 680px) {
      .accordion-gallery { --ag-radius: 16px; --ag-gap: 10px; perspective: 900px; }
      .ag-panel__label { left: 14px; right: 14px; bottom: 14px; }
      .ag-panel__text { font-size: 0.92rem; white-space: normal; line-height: 1.3; }
    }
    @media (prefers-reduced-motion: reduce) { .ag-panel, .ag-panel__media { will-change: auto; } }

    /* Descripció del panell seleccionat de la galeria */
    .ag-detail {
      margin-top: 22px; padding: 22px 24px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.6); border: 1px solid var(--borde-claro);
      animation: agDetailIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .ag-detail-index {
      display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em;
      color: var(--riesgo-color-dinamico); margin-bottom: 8px; font-variant-numeric: tabular-nums;
    }
    .ag-detail strong { display: block; font-size: 1.05rem; font-weight: 800; color: var(--texto-principal); line-height: 1.35; }
    .ag-detail p { margin: 8px 0 0; font-size: 0.92rem; color: var(--texto-mutado); line-height: 1.7; max-width: 78ch; }
    @keyframes agDetailIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ag-detail { animation: none; } }
    @media (max-width: 680px) { .ag-detail { padding: 18px; margin-top: 16px; } }

    .model-container {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 1) 70%);
    }

    /* =========================================
       ESTILS NOUS: PÀGINA CENTRADA EN EL DISPOSITIU
       ========================================= */
    .hero-eyebrow-chip {
      display: inline-flex; align-items: center; gap: 8px; background: var(--riesgo-bg-suave);
      color: var(--riesgo-color-dinamico); padding: 6px 16px; border-radius: 99px; font-weight: 800;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--riesgo-borde);
      margin-bottom: 22px;
    }
    .quick-specs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .quick-spec-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px 10px; text-align: center;
      box-shadow: var(--glass-shadow); transition: var(--transicion);
    }
    .quick-spec-card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.7); }
    .quick-spec-icon {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(5,150,105,0.10); border: 1px solid rgba(5,150,105,0.18); color: var(--riesgo-color-dinamico);
    }
    .quick-spec-label { font-weight: 700; font-size: 0.78rem; color: var(--texto-principal); line-height: 1.3; }

    /* Icones SVG: mida uniforme a tota la pàgina */
    .ico { display: inline-block; flex: none; vertical-align: middle; }

    .header-sadrif-seccion { max-width: 1000px; margin: 0 auto 32px; text-align: center; }
    .header-sadrif-seccion h3 { margin: 0 0 10px; }
    .header-sadrif-seccion p { margin: 0; }

    /* Visor 3D a tota amplada */
    .viewer-shell {
      max-width: 1150px; margin: 0 auto; position: relative;
      background: var(--glass-bg); backdrop-filter: blur(24px) saturate(120%); -webkit-backdrop-filter: blur(24px) saturate(120%);
      border: 1px solid var(--glass-border); border-radius: 28px; box-shadow: var(--glass-shadow);
      padding: 14px; overflow: hidden;
    }
    .viewer-shell::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(16,185,129,0.10), transparent 70%);
    }
    .viewer-stage { position: relative; height: 62vh; min-height: 380px; max-height: 660px; border-radius: 18px; overflow: hidden; }
    .viewer-hint {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
      display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 99px;
      padding: 6px 14px; font-size: 0.75rem; font-weight: 600; color: var(--texto-mutado);
      pointer-events: none; white-space: nowrap;
      animation: viewerHintOut 0.6s ease 7s forwards;
    }
    @keyframes viewerHintOut { to { opacity: 0; transform: translate(-50%, 8px); } }
    @media (max-width: 640px) { .viewer-stage { height: 52vh; min-height: 320px; } .viewer-shell { padding: 10px; border-radius: 22px; } }
    @media (max-width: 400px) { .viewer-hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { .viewer-hint { animation: none; } }

    .model-toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    .toolbar-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .toolbar-btn {
      display: inline-flex; align-items: center; gap: 7px; background: var(--glass-bg); backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border); padding: 9px 16px; border-radius: 99px; font-weight: 700; font-size: 0.82rem;
      color: var(--texto-principal); cursor: pointer; transition: var(--transicion); box-shadow: var(--glass-shadow);
    }
    .toolbar-btn:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
    .toolbar-btn.actiu { background: var(--riesgo-color-dinamico); color: #fff; border-color: transparent; }
    .toolbar-btn.ar-btn { background: rgba(15,23,42,0.92); color: #fff; border-color: transparent; }
    .toolbar-btn.ar-btn:hover { background: var(--riesgo-color-dinamico); }
    .toolbar-divider { width: 1px; align-self: stretch; background: var(--borde-claro); margin: 0 2px; }
    @media (max-width: 640px) { .toolbar-divider { display: none; } }

    .spec-sheet-card {
      max-width: 900px; margin: 0 auto; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%); border: 1px solid var(--glass-border); border-radius: 22px;
      box-shadow: var(--glass-shadow); padding: 30px 32px; transition: var(--transicion);
    }
    .spec-sheet-toggle-btn {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(15,23,42,0.92); color: #fff;
      padding: 11px 22px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none;
      transition: var(--transicion);
    }
    .spec-sheet-toggle-btn:hover { background: var(--riesgo-color-dinamico); }
    .spec-sheet-toggle-btn svg { transition: transform 0.3s ease; }
    .spec-sheet-toggle-btn.obert svg { transform: rotate(180deg); }
    .spec-sheet-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, margin-top 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .spec-sheet-body > .spec-sheet-inner { overflow: hidden; min-height: 0; }
    .spec-sheet-body.obert { grid-template-rows: 1fr; opacity: 1; margin-top: 24px; }

    /* ===== FITXA TÈCNICA: components desplegables ===== */
    .spec-groups { display: grid; gap: 24px; }
    .spec-group-title {
      display: flex; align-items: center; gap: 12px; margin: 0 0 10px;
      font-size: 0.71rem; font-weight: 800; letter-spacing: 0.11em; text-transform: uppercase; color: var(--texto-mutado);
    }
    .spec-group-title::after { content: ''; flex: 1; height: 1px; background: var(--borde-claro); }
    .spec-list {
      list-style: none; margin: 0; padding: 0; border: 1px solid var(--borde-claro);
      border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, 0.55);
    }
    .spec-item + .spec-item { border-top: 1px solid var(--borde-claro); }
    .spec-item-head {
      width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: none; border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit;
      transition: background 0.25s ease;
    }
    .spec-item-head:hover { background: rgba(5, 150, 105, 0.06); }
    .spec-item-head:focus-visible { outline: 2px solid var(--riesgo-color-dinamico); outline-offset: -2px; }
    .spec-item-ico {
      flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: rgba(5, 150, 105, 0.10); border: 1px solid rgba(5, 150, 105, 0.18); color: var(--riesgo-color-dinamico);
    }

    };

    const Icon = ({ name, size = 20, stroke = 1.75, className = '', style }) => {
      const content = ICON_PATHS[name];
      if (!content) return null;
      return (
        <svg
          className={cn('ico', className)} style={style}
          width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false"
        >
          {content}
        </svg>
      );
    };

    const RotatingText = forwardRef((props, ref) => {
      const {
        texts,
        transition = { type: 'spring', damping: 25, stiffness: 300 },
        initial = { y: '100%', opacity: 0 },
        animate = { y: 0, opacity: 1 },
        exit = { y: '-120%', opacity: 0 },
        animatePresenceMode = 'wait',
        animatePresenceInitial = false,
        rotationInterval = 2500,
        staggerDuration = 0.02,
        staggerFrom = 'first',
        loop = true,
        auto = true,
        splitBy = 'characters',
        onNext,
        mainClassName,
        splitLevelClassName,
        elementLevelClassName,
        ...rest
      } = props;

      const [currentTextIndex, setCurrentTextIndex] = useState(0);

      const splitIntoCharacters = text => {
        if (typeof Intl !== 'undefined' && Intl.Segmenter) {
          const segmenter = new Intl.Segmenter('en', { granularity: 'grapheme' });
          return Array.from(segmenter.segment(text), segment => segment.segment);
        }
        return Array.from(text);
      };

      const elements = useMemo(() => {
        const currentText = texts[currentTextIndex];
        if (splitBy === 'characters') {
          const words = currentText.split(' ');
          return words.map((word, i) => ({
            characters: splitIntoCharacters(word),
            needsSpace: i !== words.length - 1
          }));
        }
        return currentText.split(splitBy).map((part, i, arr) => ({
          characters: [part],
          needsSpace: i !== arr.length - 1
        }));
      }, [texts, currentTextIndex, splitBy]);

      const getStaggerDelay = useCallback((index, totalChars) => {
        if (staggerFrom === 'first') return index * staggerDuration;
        if (staggerFrom === 'last') return (totalChars - 1 - index) * staggerDuration;
        return index * staggerDuration;
      }, [staggerFrom, staggerDuration]);

      const next = useCallback(() => {
        setCurrentTextIndex(prev => prev === texts.length - 1 ? (loop ? 0 : prev) : prev + 1);
      }, [texts.length, loop]);

      useEffect(() => {
        if (!auto) return;
        const intervalId = setInterval(next, rotationInterval);
        return () => clearInterval(intervalId);
      }, [next, rotationInterval, auto]);

      return (
        <motion.span className={cn('text-rotate', mainClassName)} {...rest} layout transition={transition}>
          <span className="text-rotate-sr-only">{texts[currentTextIndex]}</span>
          <AnimatePresence mode={animatePresenceMode} initial={animatePresenceInitial}>
            <motion.span key={currentTextIndex} className="text-rotate" layout aria-hidden="true">
              {elements.map((wordObj, wordIndex, array) => {
                const previousCharsCount = array.slice(0, wordIndex).reduce((sum, word) => sum + word.characters.length, 0);
                return (
                  <span key={wordIndex} className={cn('text-rotate-word', splitLevelClassName)}>
                    {wordObj.characters.map((char, charIndex) => (
                      <motion.span
                        key={charIndex}
                        initial={initial}
                        animate={animate}
                        exit={exit}
                        transition={{
                          ...transition,
                          delay: getStaggerDelay(previousCharsCount + charIndex, array.reduce((sum, word) => sum + word.characters.length, 0))
                        }}
                        className={cn('text-rotate-element', elementLevelClassName)}
                      >
                        {char}
                      </motion.span>
                    ))}
                    {wordObj.needsSpace && <span className="text-rotate-space"> </span>}
                  </span>
                );
              })}
            </motion.span>
          </AnimatePresence>
        </motion.span>
      );
    });

    function useElementWidth(ref) {
      const [width, setWidth] = useState(0);
      useLayoutEffect(() => {
        function updateWidth() {
          if (ref.current) setWidth(ref.current.offsetWidth);
        }
        updateWidth();
        window.addEventListener('resize', updateWidth);
        return () => window.removeEventListener('resize', updateWidth);
      }, [ref]);
      return width;
    }

    const ScrollVelocity = ({
      texts = [], velocity = 100, className = '', damping = 50, stiffness = 400, numCopies = 6
    }) => {
      function VelocityText({ children, baseVelocity, className }) {
        const baseX = useMotionValue(0);
        const { scrollY } = useScroll();
        const scrollVelocity = useVelocity(scrollY);
        const smoothVelocity = useSpring(scrollVelocity, { damping, stiffness });
        const velocityFactor = useTransform(smoothVelocity, [0, 1000], [0, 5], { clamp: false });

        const copyRef = useRef(null);
        const copyWidth = useElementWidth(copyRef);

        function wrap(min, max, v) {
          const range = max - min;
          const mod = (((v - min) % range) + range) % range;
          return mod + min;
        }

        const x = useTransform(baseX, v => {
          if (copyWidth === 0) return '0px';
          return `${wrap(-copyWidth, 0, v)}px`;
        });

        const directionFactor = useRef(1);
        useAnimationFrame((t, delta) => {
          let moveBy = directionFactor.current * baseVelocity * (delta / 1000);
          if (velocityFactor.get() < 0) directionFactor.current = -1;
          else if (velocityFactor.get() > 0) directionFactor.current = 1;
          moveBy += directionFactor.current * moveBy * velocityFactor.get();
          baseX.set(baseX.get() + moveBy);
        });

        const spans = [];
        for (let i = 0; i < numCopies; i++) {
          spans.push(<span className={className} key={i} ref={i === 0 ? copyRef : null}>{children}&nbsp;&nbsp;&nbsp;</span>);
        }

        return (
          <div className="parallax">
            <motion.div className="scroller" style={{ x }}>
              {spans}
            </motion.div>
          </div>
        );
      }

      return (
        <section className="py-6 overflow-hidden">
          {texts.map((text, index) => (
            <VelocityText key={index} className={className} baseVelocity={index % 2 !== 0 ? -velocity : velocity}>
              {text}
            </VelocityText>
          ))}
        </section>
      );
    };

    /* ===== CountUp (inspirat en el component de React Bits) =====
       Compta des de 0 fins al valor final la primera vegada que la xifra
       entra a la pantalla. Fa servir un IntersectionObserver i un sol
       requestAnimationFrame que s'atura tot sol quan acaba. */
    const CountUp = ({ to, duration = 1500, className = '' }) => {
      const ref = useRef(null);
      const [value, setValue] = useState(0);
      const doneRef = useRef(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setValue(to);
          return;
        }

        let rafId = null;
        const run = () => {
          const start = performance.now();
          const tick = now => {
            const p = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
            setValue(Math.round(to * eased));
            if (p < 1) rafId = requestAnimationFrame(tick);
          };
          rafId = requestAnimationFrame(tick);
        };

        const io = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting && !doneRef.current) {
            doneRef.current = true;
            run();
            io.disconnect();
          }
        }, { threshold: 0.4 });

        io.observe(el);
        return () => { io.disconnect(); if (rafId) cancelAnimationFrame(rafId); };
      }, [to, duration]);

      return <span ref={ref} className={className}>{value}</span>;
    };

    /* Marcador de posició mentre no hi hagi les fotografies reals dels components.
       És un SVG inline (no fa cap petició a la xarxa) amb l'estètica de la web. */
    const PHOTO_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#065f46"/>
        </linearGradient></defs>
        <rect width="800" height="1000" fill="url(#g)"/>
        <g fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
           transform="translate(340,440) scale(5)">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>
        </g>
      </svg>`
    );

    /* Galeria acordió.
       Funciona en dues orientacions: en horitzontal a l'escriptori i en
       vertical al mòbil, amb la mateixa animació. Abans, per sota de 680 px,
       el CSS anul·lava l'efecte i quedava una simple llista d'imatges. */
    const AccordionGallery = ({ items }) => {
      const rootRef = useRef(null);
      const panelRefs = useRef([]);
      const mediaRefs = useRef([]);
      const barRefs = useRef([]);
      const textRefs = useRef([]);
      const tlRef = useRef(null);
      const [active, setActive] = useState(0);
      const [vertical, setVertical] = useState(false);

      const count = items.length;

      /* Una sola font de veritat per a l'orientació: la mateixa consulta
         de mitjans que fa servir el CSS, escoltada des de JS. */
      useEffect(() => {
        const mq = window.matchMedia('(max-width: 680px)');
        const sync = () => setVertical(mq.matches);
        sync();
        mq.addEventListener('change', sync);
        return () => mq.removeEventListener('change', sync);
      }, []);

      const applyLayout = useCallback(() => {
        const panels = panelRefs.current;
        if (!panels.length || !window.gsap) return;

        tlRef.current?.kill();
        const tl = window.gsap.timeline();

        panels.forEach((panel, i) => {
          if (!panel) return;
          const isActive = i === active;
          const media = mediaRefs.current[i];
          const bar = barRefs.current[i];
          const text = textRefs.current[i];

          const grow = count > 1 ? (0.48 * (count - 1)) / (1 - 0.48) : 1;
          const tilt = isActive ? 0 : i < active ? 6 : -6;

          tl.to(panel, {
            flexGrow: isActive ? grow : 1,
            /* En vertical el gir ha de ser sobre l'eix X: amb rotateY
               la perspectiva aniria en contra del sentit de l'apilament. */
            rotateY: vertical ? 0 : tilt,
            rotateX: vertical ? -tilt : 0,
            duration: 0.6, ease: 'power3.out'
          }, 0);

          if (media) {
            tl.to(media, {
              xPercent: -50, yPercent: -50,
              '--ag-gray': isActive ? 0 : 1,
              '--ag-dim': isActive ? 0 : 0.15,
              duration: 0.6, ease: 'power3.out'
            }, 0);
          }
          if (bar && text) {
            if (isActive) {
              tl.to([bar, text], { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out', stagger: 0.06 }, 0);
            } else {
              tl.to([bar, text], { opacity: 0, x: -14, duration: 0.36, ease: 'power3.out' }, 0);
            }
          }
        });
        tlRef.current = tl;
      }, [active, count, vertical]);

      useEffect(() => {
        const el = rootRef.current;
        if (!el) return;
        const measure = () => {
          const rect = el.getBoundingClientRect();
          // En vertical el que creix és l'alçada, no l'amplada.
          const along = vertical ? rect.height : rect.width;
          const usable = Math.max(along - 12 * (count - 1), 120);
          const size = Math.max(140, usable * 0.48 * 1.22);
          el.style.setProperty('--ag-media-size', `${size}px`);
          applyLayout();
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, [applyLayout, count, vertical]);

      useEffect(() => { applyLayout(); }, [applyLayout]);

      const item = items[active];

      return (
        <div>
          <div
            ref={rootRef}
            className={cn('accordion-gallery', vertical && 'accordion-gallery--vertical')}
            style={{ height: vertical ? '520px' : '480px' }}
            role="tablist"
          >
            {items.map((it, i) => {
              const isActive = i === active;
              return (
                <button
                  key={i}
                  type="button"
                  ref={el => (panelRefs.current[i] = el)}
                  className={`ag-panel${isActive ? ' ag-panel--active' : ''}`}
                  onClick={() => setActive(i)}
                  /* Al mòbil no hi ha hover; el clic ja cobreix el cas. */
                  onMouseEnter={() => { if (!vertical) setActive(i); }}
                  role="tab"
                  aria-selected={isActive}
                  aria-label={it.label}
                >
                  <span className="ag-panel__frame">
                    <span className="ag-panel__media" ref={el => (mediaRefs.current[i] = el)}>
                      <img
                        src={it.image} alt="" draggable="false" loading="lazy"
                        onError={e => { e.target.onerror = null; e.target.src = PHOTO_PLACEHOLDER; }}
                      />
                    </span>
                    <span className="ag-panel__overlay" aria-hidden="true" />
                  </span>
                  <span className="ag-panel__label" aria-hidden="true">
                    <span className="ag-panel__bar" ref={el => (barRefs.current[i] = el)} />
                    <span className="ag-panel__text" ref={el => (textRefs.current[i] = el)}>{it.label}</span>
                  </span>
                </button>
              );
            })}
          </div>

          {/* Descripció del panell seleccionat. El `key` fa que React remunti
              el bloc, de manera que l'animació d'entrada es torna a reproduir. */}
          <div className="ag-detail" key={active} role="tabpanel">
            <span className="ag-detail-index">{String(active + 1).padStart(2, '0')} / {String(count).padStart(2, '0')}</span>
            <strong>{item.label}</strong>
            <p>{item.desc}</p>
          </div>
        </div>
      );
    };

              detail: "Detecta la concentració de CO₂ equivalent i de compostos orgànics volàtils. És l'indici més primerenc de combustió: quan alguna cosa comença a cremar-se, aquests valors pugen abans que el fum sigui visible a simple vista.",
              meta: ['eCO₂ i TVOC', 'Detecció precoç de combustió', 'Bus I²C']
            }
          ]
        },
        {
          group: 'Interfície local',
          items: [
            {
              ico: 'display', name: 'Pantalla OLED 0,96"', sub: 'Lectures visibles al mateix dispositiu',
              detail: "Mostra les mesures i el nivell de risc directament sobre la caixa. És clau perquè el dispositiu segueixi sent útil encara que la cobertura Wi-Fi falli: qui s'acosti a l'estació pot veure l'estat del bosc en aquell moment sense necessitat de cap pantalla externa.",
              meta: ['128 × 64 píxels', 'Funciona sense connexió', 'Consum molt baix']
            }
          ]
        },
        {
          group: 'Alimentació autònoma', power: true,
          items: [
            {
              ico: 'solar', name: 'Mini plaques solars', sub: 'Font d\'energia principal',
              detail: "Alimenten el dispositiu durant el dia i, alhora, recarreguen la bateria per a la nit. Són el motiu pel qual l'estació pot estar instal·lada enmig del bosc, lluny de qualsevol endoll, i seguir funcionant indefinidament.",
              meta: ['Orientació al sol', 'Recàrrega diürna', 'Sense manteniment']
            },
            {
              ico: 'batteryCharging', name: 'Mòdul de càrrega TP4056', sub: 'Gestió segura de la bateria',
              detail: "Controla com es carrega la bateria de liti i la protegeix de sobrecàrregues i descàrregues profundes, els dos motius que més escurcen la vida d'aquest tipus de bateries. Sense aquest mòdul, l'estació duraria unes poques setmanes.",
              meta: ['Protecció de sobrecàrrega', 'Tall per descàrrega profunda', 'Càrrega per USB']
            },
            {
              ico: 'battery', name: 'Bateria de liti', sub: 'Autonomia nocturna i dies ennuvolats',
              detail: "Guarda l'energia sobrant del dia per mantenir el dispositiu actiu quan no hi ha sol. La versió compacta munta entre 3.000 i 3.500 mAh; la versió d'autonomia estesa, entre 4.000 i 5.000 mAh, pensada per a èpoques de menys hores de llum.",
              meta: ['3,7 V nominals', '3.000–3.500 mAh (compacta)', '4.000–5.000 mAh (estesa)']
            },
            {
              ico: 'bolt', name: 'Convertidor Step-Up MT3608', sub: 'Elevador de tensió',
              detail: "La bateria dona 3,7 V, però l'ESP32 i els sensors en necessiten 5. Aquest convertidor eleva la tensió i la manté estable encara que la bateria es vagi descarregant, de manera que les lectures no es distorsionen quan queda poca càrrega.",
              meta: ['3,7 V → 5 V', 'Sortida estabilitzada', 'Alt rendiment']
            },
            {
              ico: 'cable', name: 'Cablejat i protoboard', sub: 'Connexionat del conjunt',
              detail: "Uneix tots els mòduls dins de la carcassa. El muntatge està pensat perquè qualsevol component es pugui substituir per separat sense desmuntar la resta de l'estació, cosa important per al manteniment al bosc.",
              meta: ['Muntatge modular', 'Components substituïbles', 'Cablejat protegit']
            }
          ]
        },
        {
          group: 'Estructura i desplegament',
          items: [
            {
              ico: 'layers', name: 'Carcassa impresa en 3D', sub: 'Disseny propi, resistent a la intempèrie',
              detail: "Dissenyada i impresa per nosaltres. Protegeix l'electrònica de la pluja i del sol directe, però deixa passar l'aire cap als sensors: si la caixa fos completament tancada, les lectures de temperatura i humitat serien les de dins de la caixa, no les del bosc.",
              meta: ['Disseny propi', 'Ventilació dirigida als sensors', 'Peces reimprimibles']
            },
            {
              ico: 'shield', name: 'Model de risc 30-30-30', sub: 'Puntuació de 0 a 100',
              detail: "Les lectures no es mostren en cru: es converteixen en una puntuació de risc de 0 a 100. La regla del 30-30-30 marca l'escenari crític — 30 °C o més, 30 % d'humitat o menys i 30 km/h de vent o més alhora — i el sistema avisa quan s'hi acosta.",
              meta: ['Puntuació 0–100', 'Regla del 30-30-30', 'Avís automàtic al panell']
            },
            {
              ico: 'mapPin', name: 'Ubicació actual', sub: 'Bosc de Can Deu (Sabadell)',
              detail: "L'estació està instal·lada al Torrent de Colobrers, dins del bosc de Can Deu. És una zona de vegetació mediterrània amb risc real d'incendi durant l'estiu, cosa que permet validar el sistema amb dades autèntiques i no simulades.",
              meta: ['Torrent de Colobrers', 'Vegetació mediterrània', 'Dades reals, no simulades']
            }
          ]
        }
      ];

      /* Com funciona: el recorregut de la dada, de l'aire fins al teu mòbil */
      const flowSteps = [
        { ico: 'thermometer', n: 'PAS 01', title: 'Mesura', text: "Els quatre sensors prenen lectures de temperatura, humitat, vent i qualitat de l'aire de manera contínua, dia i nit." },
        { ico: 'chip', n: 'PAS 02', title: 'Calcula', text: "L'ESP32 creua les quatre variables amb el model del 30-30-30 i les converteix en una puntuació de risc de 0 a 100." },
        { ico: 'wifi', n: 'PAS 03', title: 'Envia', text: 'El resultat viatja per Wi-Fi fins a ThingSpeak, que guarda cada lectura i en manté tot l\'històric.' },
        { ico: 'shield', n: 'PAS 04', title: 'Avisa', text: "El panell web es refresca en temps real i dispara una alerta visible quan els tres llindars crítics es compleixen alhora." }
      ];

      const powerChain = [
        { ico: 'solar', name: 'Plaques solars', desc: "Capten l'energia del sol" },
        { ico: 'batteryCharging', name: 'TP4056', desc: 'Regula i protegeix la càrrega' },
        { ico: 'battery', name: 'Bateria de liti', desc: '3,7 V per a la nit' },
        { ico: 'bolt', name: 'Step-Up MT3608', desc: 'Eleva 3,7 V fins a 5 V' },
        { ico: 'chip', name: 'ESP32 i sensors', desc: 'Alimentats a 5 V estables' }
      ];

      const stats = [
        { num: 24, unit: 'h', label: 'Vigilància contínua', sub: 'Cada dia de l\'any, sense pauses' },
        { num: 4, unit: '', label: 'Sensors ambientals', sub: 'Temperatura, humitat, vent i aire' },
        { num: 0, unit: 'W', label: 'Consum de xarxa', sub: 'Funciona només amb energia solar' },
        { num: 100, unit: '%', label: 'Dades obertes', sub: 'Consultables per qualsevol persona' }
      ];

      const faqs = [
        { q: 'Què passa de nit o els dies ennuvolats?', a: "La bateria de liti acumula durant el dia l'energia sobrant de les plaques solars. De nit, o quan hi ha poca llum, el dispositiu es continua alimentant d'aquesta reserva, de manera que la vigilància no s'interromp en cap moment." },
        { q: 'Detecta el foc o el risc que es produeixi?', a: "Detecta el risc, que és precisament la diferència. Quan un incendi ja és visible, sovint ja s'ha propagat massa. SADRIF vigila les condicions ambientals que fan possible que el foc s'origini i avisa abans, no després." },
        { q: 'Per què la carcassa és impresa en 3D?', a: "Perquè ens permet dissenyar-la exactament a mida dels components i reimprimir qualsevol peça si es fa malbé. També abarateix moltíssim el cost: replicar l'estació en una altra zona del bosc només requereix el material d'impressió i l'electrònica." },
        { q: 'Les dades són reals o simulades?', a: "Les de l'estació de Sabadell són reals i venen directament del dispositiu instal·lat al Torrent de Colobrers. Al mapa del panell, les altres províncies catalanes es mostren amb valors de referència per poder comparar, i estan identificades com a tals." },
        { q: "Es pot veure l'estació en realitat augmentada?", a: "Sí. Des d'un mòbil o una tauleta compatible, el botó de realitat augmentada del visor 3D projecta el dispositiu a mida real a l'espai que tinguis al davant, de manera que en pots comprovar les dimensions autèntiques." },
        { q: "Qui hi ha darrere del projecte?", a: "Quatre alumnes de 2n de Batxillerat de l'Institut Sabadell. SADRIF és el nostre Treball de Recerca: el disseny 3D, el muntatge electrònic, la programació i aquesta mateixa web els hem fet nosaltres." }
      ];

      const setView = (name, orbit) => {
        setActiveView(name);
        if (modelRef.current) {
          modelRef.current.cameraOrbit = orbit;
        }
      };

      const handleAR = () => {
        const mv = modelRef.current;
        if (mv && typeof mv.activateAR === 'function') {
          mv.activateAR();
        }
      };

      /* Galeria de components.
         SUBSTITUIR per fotografies reals: veure ASSETS-NECESSARIS.md */
      const componentsItems = [
        {
          image: 'foto-caja-sadrif.jpeg',
          label: 'Dispositiu SADRIF — Muntatge complet',
          desc: "El conjunt acabat: la carcassa impresa en 3D amb les tres mini plaques solars al frontal, l'anemòmetre de cassoletes a la part superior i les reixes laterals que deixen circular l'aire fins als sensors. Tot el que hi ha a la resta de la galeria viu aquí dins."
        },
        {
          image: 'foto-component-esp32.jpeg',
          label: 'ESP32 STEAMakers — Placa principal',
          desc: "La placa que ho controla tot, amb el mòdul ESP32-WROOM-32 al centre. Els connectors grocs i vermells són els ports on s'endollen directament els sensors, sense haver de soldar-los: per això vam triar aquesta placa i no una ESP32 pelada."
        },
        {
          image: 'foto-component-sensors.jpeg',
          label: 'DHT11 i BMP280 — Temperatura, humitat i pressió',
          desc: "Els dos sensors que donen dos dels tres factors del 30-30-30. A dalt, el BMP280 (pressió atmosfèrica); a baix, el DHT11, el mòdul blau amb la reixeta, que mesura temperatura i humitat relativa de l'aire."
        },
        {
          image: 'foto-component-anemometre.jpeg',
          label: 'Anemòmetre — Velocitat del vent',
          desc: "Les tres cassoletes giren amb el vent i el sensor compta les voltes per segon per traduir-les a km/h. És el tercer factor de la regla i el més determinant: el vent és el que fa que un foc petit es converteixi en un incendi."
        },
        {
          image: 'foto-component-cam.jpeg',
          label: 'ESP32-CAM — Vigilància visual del bosc',
          desc: "Mòdul amb càmera OV2640 i el seu propi microcontrolador. Serveix per confirmar amb els ulls què està passant quan les dades disparen el risc: distingir una onada de calor d'una columna de fum."
        },
        {
          image: 'foto-component-energia.jpeg',
          label: 'Plaques solars, TP4056 i bateria — Energia autònoma',
          desc: "A dalt, una de les mini plaques solars de 80 × 45 mm vista pel davant i pel darrere. A baix, el mòdul de càrrega TP4056, que és qui regula l'energia que entra a la bateria i evita sobrecàrregues."
        }
      ];

      return (
        <div className="font-sans">

          {/* HERO SECTION — CENTRAT NOMÉS EN EL DISPOSITIU */}
          <header className="hero-container flex flex-col items-center text-center py-20 px-4 min-h-[50vh] justify-center relative">
            <span className="hero-eyebrow-chip">Dispositiu SADRIF</span>

            <h2 className="text-3xl sm:text-5xl md:text-6xl font-extrabold flex flex-col md:flex-row flex-wrap justify-center items-center gap-3 md:gap-4 text-slate-800 max-w-5xl">
              <span>El dispositiu SADRIF és</span>
              <RotatingText
                texts={heroWords}
                mainClassName="px-5 py-2 bg-emerald-500 text-white rounded-xl overflow-hidden justify-center inline-flex shadow-lg shadow-emerald-500/20"
                staggerFrom="first"
                initial={{ y: "100%", opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: "-120%", opacity: 0 }}
                staggerDuration={0.02}
                splitLevelClassName="overflow-hidden pb-1"
                transition={{ type: "spring", damping: 25, stiffness: 350 }}
                rotationInterval={3000}
              />
            </h2>
            <p className="mt-7 text-lg sm:text-xl text-slate-600 max-w-3xl leading-relaxed">
              L'estació física que vigila el bosc les 24 hores del dia, instal·lada al Bosc de Can Deu (Sabadell).
            </p>

            <div className="quick-specs-grid mt-10 max-w-2xl w-full">
              {quickSpecs.map((spec, i) => (
                <div className="quick-spec-card" key={i}>
                  <span className="quick-spec-icon"><Icon name={spec.icon} size={22} /></span>
                  <span className="quick-spec-label">{spec.label}</span>
                </div>
              ))}
            </div>
          </header>

          {/* MARQUEE SECTION */}
          <div className="bg-emerald-50 py-8 border-y border-emerald-100">
            <ScrollVelocity texts={marqueeTexts} velocity={30} className="custom-scroll-text" numCopies={4} />
          </div>

          {/* MODEL 3D INTERACTIU */}
          <section className="py-20 px-4 bg-white">
            <div className="header-sadrif-seccion">
              <h3 className="text-3xl sm:text-5xl font-bold text-slate-900">El Dispositiu al Detall</h3>
              <p className="text-slate-600 text-lg">
                Gira'l, fes zoom, obre'l per veure'n l'interior o projecta'l a mida real amb Realitat Augmentada.
              </p>
            </div>

            <div className="viewer-shell">
              <div className="viewer-stage model-container">
                <model-viewer
                  ref={modelRef}
                  src={modelSrc}
                  alt="Model 3D del dispositiu SADRIF"
                  auto-rotate={autoRotate ? true : undefined}
                  camera-controls
                  camera-orbit="0deg 75deg auto"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  shadow-intensity="1"
                  environment-image="neutral"
                  exposure="1"
                  loading="lazy"
                  style={{ width: '100%', height: '100%', borderRadius: '18px', outline: 'none' }}
                >
                </model-viewer>
                <span className="viewer-hint">
                  <Icon name="rotate" size={14} /> Arrossega per girar · pessiga per fer zoom
                </span>
              </div>
            </div>

            {/* CONTROLES DEL MODELO 3D */}
            <div className="model-toolbar">
              <div className="toolbar-group">
                <button
                  onClick={() => setModelSrc('sadrif_3d.glb')}
                  className={`toolbar-btn ${modelSrc === 'sadrif_3d.glb' ? 'actiu' : ''}`}
                >
                  <Icon name="cube" size={16} /> Dispositiu Tancat
                </button>
                <button
                  onClick={() => setModelSrc('sadrif_inside.glb')}
                  className={`toolbar-btn ${modelSrc === 'sadrif_inside.glb' ? 'actiu' : ''}`}
                >
                  <Icon name="wrench" size={16} /> Dispositiu Obert (Interior)
                </button>
              </div>

              <div className="toolbar-divider"></div>

              <div className="toolbar-group">
                <button onClick={() => setView('frontal', '0deg 75deg auto')} className={`toolbar-btn ${activeView === 'frontal' ? 'actiu' : ''}`}>Vista Frontal</button>
                <button onClick={() => setView('lateral', '90deg 75deg auto')} className={`toolbar-btn ${activeView === 'lateral' ? 'actiu' : ''}`}>Vista Lateral</button>
                <button onClick={() => setView('superior', '0deg 20deg auto')} className={`toolbar-btn ${activeView === 'superior' ? 'actiu' : ''}`}>Vista Superior</button>
              </div>

              <div className="toolbar-divider"></div>

              <div className="toolbar-group">
                <button onClick={() => setAutoRotate(v => !v)} className={`toolbar-btn ${autoRotate ? 'actiu' : ''}`}>
                  <Icon name={autoRotate ? 'pause' : 'play'} size={15} />
                  {autoRotate ? 'Aturar rotació' : 'Rotació automàtica'}
                </button>
                <button onClick={handleAR} className="toolbar-btn ar-btn">
                  <Icon name="ar" size={16} /> Veure en Realitat Augmentada
                </button>
              </div>
            </div>
          </section>

          {/* VÍDEO DEL PROJECTE
              Càrrega diferida: fins que no es fa clic només hi ha una imatge,
              cap script de YouTube. Així la pàgina segueix carregant ràpid. */}
          <section className="video-section py-20 px-4">
            <div className="video-wrap">
              <div className="video-head">
                <span className="hero-eyebrow-chip"><Icon name="youtube" size={14} /> Vídeo</span>
                <h3 className="text-3xl sm:text-5xl font-bold">SADRIF en moviment</h3>
                <p>Del disseny 3D fins a l'estació instal·lada al bosc de Can Deu, explicat en vídeo.</p>
              </div>

              {videoOn ? (
                <div className="yt-facade">
                  <iframe
                    src="https://www.youtube-nocookie.com/embed/5t9_Szm1RwA?autoplay=1&rel=0&modestbranding=1"
                    title="Vídeo del projecte SADRIF"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allowFullScreen
                  ></iframe>
                </div>
              ) : (
                <button
                  type="button"
                  className="yt-facade"
                  onClick={() => setVideoOn(true)}
                  aria-label="Reproduir el vídeo del projecte SADRIF"
                >
                  <img
                    src="https://i.ytimg.com/vi/5t9_Szm1RwA/maxresdefault.jpg"
                    alt="Miniatura del vídeo del projecte SADRIF"
                    loading="lazy"
                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://i.ytimg.com/vi/5t9_Szm1RwA/hqdefault.jpg'; }}
                  />
                  <span className="yt-veil"></span>
                  <span className="yt-play"><Icon name="play" size={34} /></span>
                  <span className="yt-caption">
                    <span className="yt-badge"><Icon name="youtube" size={13} /> YouTube</span>
                    <strong>Pla DRIF — El projecte SADRIF</strong>
                  </span>
                </button>
              )}
            </div>
          </section>

          {/* COM FUNCIONA */}
          <section className="py-20 px-4 bg-white">
            <div className="header-sadrif-seccion">
              <h3 className="text-3xl sm:text-5xl font-bold text-slate-900">Com funciona</h3>
              <p className="text-slate-600 text-lg">
                El recorregut complet d'una dada: des de l'aire del bosc fins a l'alerta de la teva pantalla.
              </p>
            </div>

            <div className="flow-grid">
              {flowSteps.map((s, i) => (
                <div className="flow-step" key={i}>
                  <div className="flow-step-top">
                    <span className="flow-ico"><Icon name={s.ico} size={22} /></span>
                    <span className="flow-n">{s.n}</span>
                  </div>
                  <h4>{s.title}</h4>
                  <p>{s.text}</p>
                </div>
              ))}
            </div>

            <div className="power-card">
              <h4>I tot això, sense endoll</h4>
              <p>
                L'estació és al mig del bosc, així que ha de generar-se la seva pròpia energia. Aquesta és la cadena
                que la manté funcionant les 24 hores.
              </p>
              <div className="power-chain">
                {powerChain.map((n, i) => (
                  <React.Fragment key={i}>
                    <div className="power-node">
                      <span className="power-ico"><Icon name={n.ico} size={22} /></span>
                      <strong>{n.name}</strong>
                      <span>{n.desc}</span>
                    </div>
                    {i < powerChain.length - 1 && (
                      <span className="power-link"><Icon name="arrowRight" size={18} /></span>
                    )}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </section>

          {/* XIFRES */}
          <section className="py-16 px-4 bg-slate-50">
            <div className="stats-band">
              {stats.map((s, i) => (
                <div className="stat-card" key={i}>
                  <div className="stat-num"><CountUp to={s.num} duration={1400 + i * 120} /><small>{s.unit}</small></div>
                  <div className="stat-label">{s.label}</div>
                  <div className="stat-sub">{s.sub}</div>
                </div>
              ))}
            </div>
          </section>

          {/* FITXA TÈCNICA — desplegable amb tots els components */}
          <section className="py-20 px-4 bg-white">
            <div className="spec-sheet-card">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900 m-0">Fitxa Tècnica</h3>
                  <p className="text-slate-500 text-sm mt-1">
                    Tots els components del dispositiu. Obre'n qualsevol per veure'n l'explicació completa.
                  </p>
                </div>
                <button
                  className={`spec-sheet-toggle-btn ${specOpen ? 'obert' : ''}`}
                  onClick={() => setSpecOpen(v => !v)}
                  aria-expanded={specOpen}
                >
                  {specOpen ? 'Amagar fitxa' : 'Veure fitxa completa'}
                  <Icon name="chevronDown" size={16} stroke={2} />
                </button>
              </div>

              <div className={`spec-sheet-body ${specOpen ? 'obert' : ''}`}>
                <div className="spec-sheet-inner">
                  <div className="spec-groups">
                    {specGroups.map((g, gi) => (
                      <div key={gi}>
                        <div className="spec-group-title">{g.group}</div>
                        <ul className="spec-list">
                          {g.items.map((it, ii) => {
                            const id = `${gi}-${ii}`;
                            const obert = openSpecItem === id;
                            return (
                              <li className={cn('spec-item', g.power && 'spec-item--power', obert && 'obert')} key={ii}>
                                <button
                                  className="spec-item-head"
                                  onClick={() => setOpenSpecItem(obert ? null : id)}
                                  aria-expanded={obert}
                                >
                                  <span className="spec-item-ico"><Icon name={it.ico} size={19} /></span>
                                  <span className="spec-item-txt">
                                    <strong>{it.name}</strong>
                                    <span>{it.sub}</span>
                                  </span>
                                  <Icon name="chevronDown" size={18} className="spec-item-chev" />
                                </button>
                                <div className="spec-item-body">
                                  <div>
                                    <div className="spec-item-detail">
                                      <p>{it.detail}</p>
                                      <div className="spec-meta">
                                        {it.meta.map((m, mi) => <span key={mi}>{m}</span>)}
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </li>
                            );
                          })}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ACCORDION GALLERY SECTION */}
          <section className="py-20 px-4 bg-slate-50">
            <div className="header-sadrif-seccion">
              <h3 className="text-3xl sm:text-5xl font-bold text-slate-900">Arquitectura del Sistema</h3>
              <p className="text-slate-600 text-lg">
                Explora els components que fan possible la detecció immediata: toca o passa el ratolí per cada peça.
              </p>
            </div>
            <div className="gallery-wrap-card">
              <AccordionGallery items={componentsItems} />
            </div>
          </section>

          {/* PREGUNTES FREQÜENTS */}
          <section className="py-20 px-4 bg-white">

  <!-- SCRIPT DEL MENÚ CARDNAV (GSAP) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const navEl = document.getElementById('card-nav');
        const hamburger = document.getElementById('card-nav-hamburger');
        const contentEl = document.getElementById('card-nav-content');
        const cards = document.querySelectorAll('.nav-card');
        let isExpanded = false;
        let navTimeline;

        gsap.set(navEl, { height: 60, overflow: 'hidden' });
        gsap.set(cards, { y: 50, opacity: 0 });
        navTimeline = gsap.timeline({ paused: true });

        function calculateHeight() {
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (isMobile) {
                const wasVisibility = contentEl.style.visibility;
                const wasPosition = contentEl.style.position;
                contentEl.style.visibility = 'hidden';
                contentEl.style.position = 'absolute';
                contentEl.style.display = 'flex';
                const contentHeight = contentEl.scrollHeight;
                contentEl.style.visibility = wasVisibility;
                contentEl.style.position = wasPosition;
                contentEl.style.display = '';

                const topBar = 60;
                const padding = 16;
                return topBar + contentHeight + padding;
            }
            return 260; 
        }

        function createTimeline() {
            navTimeline.clear();
            navTimeline.to(navEl, { height: calculateHeight, duration: 0.5, ease: 'power2.inOut' });
            navTimeline.to(cards, { y: 0, opacity: 1, duration: 0.42, ease: 'power2.out', stagger: 0.07 }, '-=0.28');
        }

        createTimeline();

        hamburger.addEventListener('click', () => {
            isExpanded = !isExpanded;
            hamburger.classList.toggle('open', isExpanded);
            navEl.classList.toggle('open', isExpanded);
            contentEl.setAttribute('aria-hidden', !isExpanded);

            if (isExpanded) {
                navTimeline.timeScale(1).play(0);
            } else {
                navTimeline.timeScale(1.15).reverse();
            }
        });

        window.addEventListener('resize', () => {
            if (isExpanded) {
                gsap.set(navEl, { height: calculateHeight() });
                createTimeline();
                navTimeline.progress(1);
            } else {
                createTimeline();
            }
        });
        
        document.querySelectorAll('.nav-card-link').forEach(link => {
            link.addEventListener('click', () => {
                if (isExpanded) {
                    hamburger.click();
                }
            });
        });
    });
  </script>
