<!DOCTYPE html>
<html lang="ca" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pla DRIF | Prevenció d'Incendis Forestals</title>
  
  <!-- Fuentes para el menú CardNav -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Model Viewer (Para el modelo 3D) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* =========================================
       VARIABLES Y ESTILOS DEL MENÚ CARDNAV
       ========================================= */
    :root {
        --bg-principal: #f8fafc;
        --glass-bg: rgba(255, 255, 255, 0.45); 
        --glass-border: rgba(255, 255, 255, 0.7);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        
        --texto-principal: #0f172a;
        --texto-mutado: #64748b;
        --borde-claro: rgba(226, 232, 240, 0.6);

        /* Variables Dinámicas */
        --riesgo-color-dinamico: #10b981; 
        --riesgo-bg-suave: rgba(16, 185, 129, 0.15);
        --riesgo-borde: rgba(16, 185, 129, 0.4);

        --transicion: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-principal);
      /* Se ha eliminado el background-image para quitar el degradado cortado */
      color: var(--texto-principal);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0; 
      padding: 0; 
      line-height: 1.5; 
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ========= NUEVOS ESTILOS CARDNAV ========= */
    .card-nav-container {
        position: sticky;
        top: 1rem;
        margin: 0 auto;
        width: 90%;
        max-width: 1200px;
        z-index: 1000;
        box-sizing: border-box;
        margin-bottom: 2rem;
    }

    .card-nav {
        display: block;
        height: 60px;
        padding: 0;
        background-color: var(--glass-bg);
        backdrop-filter: blur(25px) saturate(120%);
        -webkit-backdrop-filter: blur(25px) saturate(120%);
        border: 1px solid var(--glass-border);
        border-radius: 0.75rem;
        box-shadow: var(--glass-shadow);
        position: relative;
        overflow: hidden;
        will-change: height;
    }

    .card-nav-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
        z-index: 2;
    }

    .hamburger-menu {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        gap: 6px;
        width: 40px;
    }

    .hamburger-menu:hover .hamburger-line { opacity: 0.75; }

    .hamburger-line {
        width: 24px;
        height: 2px;
        background-color: var(--texto-principal);
        transition: transform 0.25s ease, opacity 0.2s ease, margin 0.3s ease;
        transform-origin: 50% 50%;
    }

    .hamburger-menu.open .hamburger-line:first-child { transform: translateY(4px) rotate(45deg); }
    .hamburger-menu.open .hamburger-line:last-child { transform: translateY(-4px) rotate(-45deg); }

    .navbar-brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem;
        color: var(--texto-principal); text-decoration: none;
        transition: var(--transicion);
    }
    .navbar-brand img { height: 28px; }

    .card-nav-content {
        position: absolute;
        left: 0; right: 0; top: 60px; bottom: 0;
        padding: 0.5rem;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        visibility: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .card-nav.open .card-nav-content {
        visibility: visible;
        pointer-events: auto;
    }

    .nav-card {
        height: 100%;
        flex: 1 1 0;
        min-width: 0;
        border-radius: calc(0.75rem - 0.2rem);
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 16px 20px;
        gap: 8px;
        user-select: none;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-card-label { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; opacity: 0.9; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 5px; }
    .nav-card-links { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .nav-card-link {
        font-size: 0.95rem; font-weight: 500; color: inherit; cursor: pointer; text-decoration: none; transition: opacity 0.3s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-card-link:hover { opacity: 0.6; }

    /* Badge Risc dins del nav */
    .sticky-risk-badge {
        display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border); padding: 5px 12px; border-radius: 99px;
        font-weight: 700; font-size: 0.85rem; box-shadow: var(--glass-shadow);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(0.95);
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        pointer-events: none;
    }

    .sticky-risk-badge.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .sticky-risk-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--riesgo-color-dinamico); box-shadow: 0 0 8px var(--riesgo-color-dinamico); animation: pulseLive 1.5s infinite; }

    @keyframes pulseLive { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

    @media (max-width: 768px) {
        .card-nav-container { width: 95%; top: 0.5rem; }
        .card-nav-top { justify-content: space-between; gap: 8px; }
        .hamburger-menu { order: 3; }
        .logo-container { order: 1; }
        .right-controls-nav { order: 2; display: flex !important; } 
        .sticky-risk-badge { padding: 4px 8px; font-size: 0.78rem; }
        
        .card-nav-content {
            flex-direction: column; 
            align-items: stretch; 
            gap: 8px; 
            padding: 0.5rem; 
            top: 60px; 
            bottom: auto; 
            justify-content: flex-start;
            overflow-y: auto; 
            max-height: calc(100vh - 80px); 
        }
        .nav-card { height: auto; min-height: auto; flex: none; padding: 16px; }
        .nav-card-label { font-size: 1.1rem; }
        .nav-card-links { gap: 12px; margin-top: 10px; }
    }

    /* =========================================
       CSS: ROTATING TEXT & OTROS COMPONENTES
       ========================================= */
    .text-rotate {
      display: flex;
      flex-wrap: wrap;
      white-space: pre-wrap;
      position: relative;
    }
    .text-rotate-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .text-rotate-word { display: inline-flex; }
    .text-rotate-lines { display: flex; flex-direction: column; width: 100%; }
    .text-rotate-element { display: inline-block; }
    .text-rotate-space { white-space: pre; }

    .parallax { position: relative; overflow: hidden; }
    .scroller {
      display: flex; white-space: nowrap; text-align: center; font-family: sans-serif;
      font-size: 2.25rem; font-weight: bold; letter-spacing: -0.02em;
    }
    .scroller span { flex-shrink: 0; }
    @media (min-width: 768px) { .scroller { font-size: 4rem; line-height: 4rem; } }
    .custom-scroll-text { color: #059669; text-transform: uppercase; padding-right: 2rem; }

    .accordion-gallery {
      --ag-accent: #059669; --ag-overlay: #f8fafc; --ag-text: #0f172a; --ag-gap: 12px; --ag-radius: 20px; --ag-media-size: 320px;
      display: flex; flex-direction: row; gap: var(--ag-gap); width: 100%; max-width: 100%;
      perspective: 1400px; perspective-origin: 50% 50%;
    }
    .accordion-gallery--vertical { flex-direction: column; }
    .ag-panel {
      position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; border-radius: var(--ag-radius);
      cursor: pointer; display: block; text-decoration: none; outline: none; transform-style: preserve-3d;
      transform-origin: center center; background: #e2e8f0; box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.2);
      will-change: flex-grow, transform; -webkit-tap-highlight-color: transparent;
    }
    .ag-panel:focus-visible { box-shadow: 0 0 0 2px var(--ag-accent), 0 10px 30px -18px rgba(0, 0, 0, 0.3); }
    .ag-panel__frame { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
    .ag-panel__media {
      --ag-gray: 1; --ag-dim: 0.15; position: absolute; top: 50%; left: 50%; width: var(--ag-media-size);
      height: 100%; filter: grayscale(var(--ag-gray)); will-change: transform, filter;
    }
    .accordion-gallery--vertical .ag-panel__media { width: 100%; height: var(--ag-media-size); }
    .ag-panel__media img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
    .ag-panel__overlay {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 35%, color-mix(in srgb, var(--ag-overlay) 90%, transparent) 100%),
                  color-mix(in srgb, var(--ag-overlay) calc(var(--ag-dim, 0.15) * 100%), transparent);
    }
    .ag-panel__label { position: absolute; left: 20px; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 12px; pointer-events: none; z-index: 2; }
    .ag-panel__bar { flex: 0 0 auto; width: 4px; height: 26px; border-radius: 4px; background: var(--ag-accent); opacity: 0; }
    .ag-panel__text {
      color: var(--ag-text); font-family: inherit; font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.4rem);
      letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0;
    }
    @media (max-width: 520px) {
      .accordion-gallery { flex-direction: column; perspective: none; height: auto !important; }
      .ag-panel { min-height: 100px; transform: none !important; }
      .accordion-gallery .ag-panel__media { width: 100%; height: var(--ag-media-size); }
    }
    @media (prefers-reduced-motion: reduce) { .ag-panel, .ag-panel__media { will-change: auto; } }
    
    .model-container {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 1) 70%);
    }
  </style>
</head>
<body>

  <!-- MENÚ CARDNAV INTEGRADO -->

  <!-- Aquí se montará la aplicación React -->
  <div id="root"></div>

  <!-- Lógica React -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect, useMemo, useCallback, forwardRef, useImperativeHandle } = React;
    const { motion, AnimatePresence, useScroll, useSpring, useTransform, useMotionValue, useVelocity, useAnimationFrame } = window.Motion;

    function cn(...classes) {
      return classes.filter(Boolean).join(' ');
    }

    const RotatingText = forwardRef((props, ref) => {
      const {
        texts,
        transition = { type: 'spring', damping: 25, stiffness: 300 },
        initial = { y: '100%', opacity: 0 },
        animate = { y: 0, opacity: 1 },
        exit = { y: '-120%', opacity: 0 },
        animatePresenceMode = 'wait',
        animatePresenceInitial = false,
        rotationInterval = 2500,
        staggerDuration = 0.02,
        staggerFrom = 'first',
        loop = true,
        auto = true,
        splitBy = 'characters',
        onNext,
        mainClassName,
        splitLevelClassName,
        elementLevelClassName,
        ...rest
      } = props;

      const [currentTextIndex, setCurrentTextIndex] = useState(0);

      const splitIntoCharacters = text => {
        if (typeof Intl !== 'undefined' && Intl.Segmenter) {
          const segmenter = new Intl.Segmenter('en', { granularity: 'grapheme' });
          return Array.from(segmenter.segment(text), segment => segment.segment);
        }
        return Array.from(text);
      };

      const elements = useMemo(() => {
        const currentText = texts[currentTextIndex];
        if (splitBy === 'characters') {
          const words = currentText.split(' ');
          return words.map((word, i) => ({
            characters: splitIntoCharacters(word),
            needsSpace: i !== words.length - 1
          }));
        }
        return currentText.split(splitBy).map((part, i, arr) => ({
          characters: [part],
          needsSpace: i !== arr.length - 1
        }));
      }, [texts, currentTextIndex, splitBy]);

      const getStaggerDelay = useCallback((index, totalChars) => {
        if (staggerFrom === 'first') return index * staggerDuration;
        if (staggerFrom === 'last') return (totalChars - 1 - index) * staggerDuration;
        return index * staggerDuration;
      }, [staggerFrom, staggerDuration]);

      const next = useCallback(() => {
        setCurrentTextIndex(prev => prev === texts.length - 1 ? (loop ? 0 : prev) : prev + 1);
      }, [texts.length, loop]);

      useEffect(() => {
        if (!auto) return;
        const intervalId = setInterval(next, rotationInterval);
        return () => clearInterval(intervalId);
      }, [next, rotationInterval, auto]);

      return (
        <motion.span className={cn('text-rotate', mainClassName)} {...rest} layout transition={transition}>
          <span className="text-rotate-sr-only">{texts[currentTextIndex]}</span>
          <AnimatePresence mode={animatePresenceMode} initial={animatePresenceInitial}>
            <motion.span key={currentTextIndex} className="text-rotate" layout aria-hidden="true">
              {elements.map((wordObj, wordIndex, array) => {
                const previousCharsCount = array.slice(0, wordIndex).reduce((sum, word) => sum + word.characters.length, 0);
                return (
                  <span key={wordIndex} className={cn('text-rotate-word', splitLevelClassName)}>
                    {wordObj.characters.map((char, charIndex) => (
                      <motion.span
                        key={charIndex}
                        initial={initial}
                        animate={animate}
                        exit={exit}
                        transition={{
                          ...transition,
                          delay: getStaggerDelay(previousCharsCount + charIndex, array.reduce((sum, word) => sum + word.characters.length, 0))
                        }}
                        className={cn('text-rotate-element', elementLevelClassName)}
                      >
                        {char}
                      </motion.span>
                    ))}
                    {wordObj.needsSpace && <span className="text-rotate-space"> </span>}
                  </span>
                );
              })}
            </motion.span>
          </AnimatePresence>
        </motion.span>
      );
    });

    function useElementWidth(ref) {
      const [width, setWidth] = useState(0);
      useLayoutEffect(() => {
        function updateWidth() {
          if (ref.current) setWidth(ref.current.offsetWidth);
        }
        updateWidth();
        window.addEventListener('resize', updateWidth);
        return () => window.removeEventListener('resize', updateWidth);
      }, [ref]);
      return width;
    }

    const ScrollVelocity = ({
      texts = [], velocity = 100, className = '', damping = 50, stiffness = 400, numCopies = 6
    }) => {
      function VelocityText({ children, baseVelocity, className }) {
        const baseX = useMotionValue(0);
        const { scrollY } = useScroll();
        const scrollVelocity = useVelocity(scrollY);
        const smoothVelocity = useSpring(scrollVelocity, { damping, stiffness });
        const velocityFactor = useTransform(smoothVelocity, [0, 1000], [0, 5], { clamp: false });

        const copyRef = useRef(null);
        const copyWidth = useElementWidth(copyRef);

        function wrap(min, max, v) {
          const range = max - min;
          const mod = (((v - min) % range) + range) % range;
          return mod + min;
        }

        const x = useTransform(baseX, v => {
          if (copyWidth === 0) return '0px';
          return `${wrap(-copyWidth, 0, v)}px`;
        });

        const directionFactor = useRef(1);
        useAnimationFrame((t, delta) => {
          let moveBy = directionFactor.current * baseVelocity * (delta / 1000);
          if (velocityFactor.get() < 0) directionFactor.current = -1;
          else if (velocityFactor.get() > 0) directionFactor.current = 1;
          moveBy += directionFactor.current * moveBy * velocityFactor.get();
          baseX.set(baseX.get() + moveBy);
        });

        const spans = [];
        for (let i = 0; i < numCopies; i++) {
          spans.push(<span className={className} key={i} ref={i === 0 ? copyRef : null}>{children}&nbsp;&nbsp;&nbsp;</span>);
        }

        return (
          <div className="parallax">
            <motion.div className="scroller" style={{ x }}>
              {spans}
            </motion.div>
          </div>
        );
      }

      return (
        <section className="py-6 overflow-hidden">
          {texts.map((text, index) => (
            <VelocityText key={index} className={className} baseVelocity={index % 2 !== 0 ? -velocity : velocity}>
              {text}
            </VelocityText>
          ))}
        </section>
      );
    };

    const AccordionGallery = ({ items }) => {
      const rootRef = useRef(null);
      const panelRefs = useRef([]);
      const mediaRefs = useRef([]);
      const barRefs = useRef([]);
      const textRefs = useRef([]);
      const tlRef = useRef(null);
      const mediaSizeRef = useRef(320);
      const [active, setActive] = useState(2);
      
      const count = items.length;

      const applyLayout = useCallback(() => {
        const panels = panelRefs.current;
        if (!panels.length || !window.gsap) return;
        
        tlRef.current?.kill();
        const tl = window.gsap.timeline();

        panels.forEach((panel, i) => {
          if (!panel) return;
          const isActive = i === active;
          const media = mediaRefs.current[i];
          const bar = barRefs.current[i];
          const text = textRefs.current[i];

          const grow = count > 1 ? (0.48 * (count - 1)) / (1 - 0.48) : 1;
          const rot = isActive ? 0 : i < active ? 6 : -6;

          tl.to(panel, { flexGrow: isActive ? grow : 1, rotateY: rot, duration: 0.6, ease: 'power3.out' }, 0);

          if (media) {
            tl.to(media, { 
              xPercent: -50, yPercent: -50, 
              '--ag-gray': isActive ? 0 : 1, 
              '--ag-dim': isActive ? 0 : 0.15, 
              duration: 0.6, ease: 'power3.out' 
            }, 0);
          }
          if (bar && text) {
            if (isActive) {
              tl.to([bar, text], { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out', stagger: 0.06 }, 0);
            } else {
              tl.to([bar, text], { opacity: 0, x: -14, duration: 0.36, ease: 'power3.out' }, 0);
            }
          }
        });
        tlRef.current = tl;
      }, [active, count]);

      useEffect(() => {
        const el = rootRef.current;
        if (!el) return;
        const measure = () => {
          const rect = el.getBoundingClientRect();
          const usable = Math.max(rect.width - 12 * (count - 1), 120);
          const size = Math.max(140, usable * 0.48 * 1.22);
          mediaSizeRef.current = size;
          el.style.setProperty('--ag-media-size', `${size}px`);
          applyLayout();
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, [applyLayout, count]);

      useEffect(() => { applyLayout(); }, [applyLayout]);

      return (
        <div ref={rootRef} className="accordion-gallery" style={{ height: '480px' }} role="list">
          {items.map((item, i) => {
            const isActive = i === active;
            return (
              <div
                key={i}
                ref={el => (panelRefs.current[i] = el)}
                className={`ag-panel${isActive ? ' ag-panel--active' : ''}`}
                onClick={() => setActive(i)}
                onMouseEnter={() => setActive(i)}
                role="listitem"
                tabIndex={0}
              >
                <span className="ag-panel__frame">
                  <span className="ag-panel__media" ref={el => (mediaRefs.current[i] = el)}>
                    <img src={item.image} alt={item.label} draggable="false" />
                  </span>
                  <span className="ag-panel__overlay" aria-hidden="true" />
                </span>
                <span className="ag-panel__label" aria-hidden="true">
                  <span className="ag-panel__bar" ref={el => (barRefs.current[i] = el)} />
                  <span className="ag-panel__text" ref={el => (textRefs.current[i] = el)}>{item.label}</span>
                </span>
              </div>
            );
          })}
        </div>
      );
    };

    function App() {
      const heroWords = [
        'seguretat per als boscos',
        "detecció precoç d'incendis",
        'tecnologia de protecció',
        'futur per al medi natural',
        'innovació en prevenció'
      ];

      const marqueeTexts = [
        "PLA DRIF • PREVENCIÓ D'INCENDIS FORESTALS • MONITORATGE EN TEMPS REAL",
        "PROTEGINT ELS NOSTRES BOSCOS • TECNOLOGIA I NATURA • SISTEMA SADRIF"
      ];

      const componentsItems = [
        { image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80', label: 'Processador Edge AI (IA Local)' },
        { image: 'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=900&q=80', label: 'Càmera Tèrmica d’Alta Precisió' },
        { image: 'https://images.unsplash.com/photo-1509391365360-2e959784a276?auto=format&fit=crop&w=900&q=80', label: 'Panell Solar i Bateria Autònoma' },
        { image: 'https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?auto=format&fit=crop&w=900&q=80', label: 'Sensors Ambientals (Tª, Humitat i Gasos)' },
        { image: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=900&q=80', label: 'Mòdul de Comunicació Long-Range' }
      ];

      return (
        <div className="font-sans">
          
          {/* HERO SECTION */}
          <header className="hero-container flex flex-col items-center text-center py-24 px-4 min-h-[60vh] justify-center relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-100/60 via-slate-50 to-slate-50 -z-10"></div>
            
            <h2 className="text-4xl sm:text-6xl md:text-7xl font-extrabold flex flex-col md:flex-row flex-wrap justify-center items-center gap-4 md:gap-6 text-slate-800">
              <span>Pla DRIF és</span>
              <RotatingText
                texts={heroWords}
                mainClassName="px-5 py-2 bg-emerald-500 text-white rounded-xl overflow-hidden justify-center inline-flex shadow-lg shadow-emerald-500/20"
                staggerFrom="first"
                initial={{ y: "100%", opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: "-120%", opacity: 0 }}
                staggerDuration={0.02}
                splitLevelClassName="overflow-hidden pb-1"
                transition={{ type: "spring", damping: 25, stiffness: 350 }}
                rotationInterval={3000}
              />
            </h2>
            <p className="mt-8 text-xl sm:text-2xl text-slate-600 max-w-4xl leading-relaxed">
              Desenvolupem eines tecnològiques d’última generació per a la monitorització, avaluació del risc i protecció activa dels espais naturals davant la amenaça dels incendis forestals.
            </p>
          </header>

          {/* MARQUEE SECTION */}
          <div className="bg-emerald-50 py-8 border-y border-emerald-100">
            <ScrollVelocity texts={marqueeTexts} velocity={30} className="custom-scroll-text" numCopies={4} />
          </div>

          {/* 3D MODEL SECTION */}
          <section className="py-24 px-4 bg-white">
            <div className="max-w-6xl mx-auto text-center mb-12">
              <h3 className="text-3xl sm:text-5xl font-bold mb-4 text-slate-900">El Dispositiu al Detall</h3>
              <p className="text-slate-600 text-lg max-w-2xl mx-auto">
                Model 3D interactiu de la nostra estació de monitoratge autònoma. Pots girar i fer zoom per veure'n el disseny.
              </p>
            </div>
            
            <div className="max-w-4xl mx-auto h-[600px] bg-white rounded-3xl border border-slate-200 p-4 model-container shadow-xl">
              <model-viewer
                src="mi_dispositivo_color.glb"
                alt="Model 3D del dispositiu Pla DRIF"
                auto-rotate
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                exposure="1"
                style={{ width: '100%', height: '100%', borderRadius: '1rem', outline: 'none' }}
              >
              </model-viewer>
            </div>
          </section>

          {/* ACCORDION GALLERY SECTION */}
          <section className="py-24 px-4 bg-slate-50">
            <div className="max-w-6xl mx-auto text-center mb-12">
              <h3 className="text-3xl sm:text-5xl font-bold mb-4 text-slate-900">Arquitectura del Sistema</h3>
              <p className="text-slate-600 text-lg max-w-2xl mx-auto">
                Explora els components d’alta tecnologia que fan possible la detecció immediata i la protecció contínua dels nostres boscos.
              </p>
            </div>
            <div className="max-w-6xl mx-auto">
              <AccordionGallery items={componentsItems} />
            </div>
          </section>

          {/* FOOTER */}
          <footer className="py-12 text-center border-t border-slate-200 bg-white mt-12">
            <p className="text-slate-500 font-medium">© 2026 Pla DRIF - Protegint la Natura amb Tecnologia.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- SCRIPT DEL MENÚ CARDNAV (GSAP) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const navEl = document.getElementById('card-nav');
        const hamburger = document.getElementById('card-nav-hamburger');
        const contentEl = document.getElementById('card-nav-content');
        const cards = document.querySelectorAll('.nav-card');
        let isExpanded = false;
        let navTimeline;

        gsap.set(navEl, { height: 60, overflow: 'hidden' });
        gsap.set(cards, { y: 50, opacity: 0 });
        navTimeline = gsap.timeline({ paused: true });

        function calculateHeight() {
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (isMobile) {
                const wasVisibility = contentEl.style.visibility;
                const wasPosition = contentEl.style.position;
                contentEl.style.visibility = 'hidden';
                contentEl.style.position = 'absolute';
                contentEl.style.display = 'flex';
                const contentHeight = contentEl.scrollHeight;
                contentEl.style.visibility = wasVisibility;
                contentEl.style.position = wasPosition;
                contentEl.style.display = '';

                const topBar = 60;
                const padding = 16;
                return topBar + contentHeight + padding;
            }
            return 260; 
        }

        function createTimeline() {
            navTimeline.clear();
            navTimeline.to(navEl, { height: calculateHeight, duration: 0.4, ease: 'power3.out' });
            navTimeline.to(cards, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', stagger: 0.08 }, '-=0.1');
        }

        createTimeline();

        hamburger.addEventListener('click', () => {
            isExpanded = !isExpanded;
            hamburger.classList.toggle('open', isExpanded);
            navEl.classList.toggle('open', isExpanded);
            contentEl.setAttribute('aria-hidden', !isExpanded);

            if (isExpanded) {
                navTimeline.timeScale(1).play(0);
            } else {
                navTimeline.timeScale(3).reverse();
            }
        });

        window.addEventListener('resize', () => {
            if (isExpanded) {
                gsap.set(navEl, { height: calculateHeight() });
                createTimeline();
                navTimeline.progress(1);
            } else {
                createTimeline();
            }
        });
        
        document.querySelectorAll('.nav-card-link').forEach(link => {
            link.addEventListener('click', () => {
                if (isExpanded) {
                    hamburger.click();
                }
            });
        });
    });
  </script>
